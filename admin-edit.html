<!DOCTYPE html><html lang="es"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>CQM - Editar Canción</title>  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">  <style>    * { margin: 0; padding: 0; box-sizing: border-box; }    body { background: #080c14; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding-bottom: 2rem; }    header { background: #0d1626; border-bottom: 1px solid #1e2d45; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; position: sticky; top: 0; z-index: 10; }    .back-btn { background: none; border: none; color: #3b82f6; font-size: 1.3rem; cursor: pointer; padding: 4px; display: flex; align-items: center; }    .header-title { font-size: 1rem; font-weight: 600; color: #e2e8f0; flex: 1; }    .container { padding: 1.25rem; max-width: 600px; margin: 0 auto; }    .form-group { margin-bottom: 1rem; }    .form-group label { display: block; font-size: 0.75rem; color: #4a5568; margin-bottom: 0.4rem; }    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }    input, select, textarea {      width: 100%; background: #0d1626; border: 1px solid #1e2d45; border-radius: 8px;      padding: 0.75rem 1rem; color: #e2e8f0; font-size: 0.9rem; outline: none; font-family: inherit;    }    input:focus, select:focus, textarea:focus { border-color: #3b82f6; }    textarea { resize: vertical; min-height: 120px; font-family: monospace; font-size: 0.85rem; }    .section-block { background: #0d1626; border: 1px solid #1e2d45; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }    .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem; }    .section-header select { flex: 1; }    .del-btn { background: #1a0808; border: 1px solid #7f1d1d; color: #ef4444; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 0.8rem; }    .move-btn { background: #1e2d45; border: none; color: #3b82f6; border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 0.7rem; }    .move-btn:disabled { opacity: 0.3; cursor: not-allowed; }    .pad { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.75rem; }    .pad-btn { background: #1e2d45; border: none; color: #3b82f6; border-radius: 6px; padding: 5px 8px; font-size: 0.8rem; font-family: monospace; font-weight: 700; cursor: pointer; }    .pad-btn:hover { background: #3b82f6; color: #fff; }    .note-input-row { display: flex; gap: 8px; margin-bottom: 0.75rem; align-items: center; }    .note-input-row input { flex: 1; }    .note-insert-btn { background: #1e2d45; border: 1px dashed #1e2d45; color: #4a5568; border-radius: 6px; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
