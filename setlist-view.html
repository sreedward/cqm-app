  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080c14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: #0d1626;
      border-bottom: 1px solid #1e2d45;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-btn {
      background: none;
      border: none;
      color: #3b82f6;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .header-info { flex: 1; }
    .setlist-title { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; }
    .setlist-date { font-size: 0.75rem; color: #4a5568; }
    .start-btn {
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .section-label {
      font-size: 0.7rem;
      color: #4a5568;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0.75rem 1.25rem 0.25rem;
    }
    .songs-list { padding: 0 1.25rem 1rem; }
    .song-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.75rem 0;
      border-bottom: 1px solid #0d1626;
    }
    .song-card:last-child { border-bottom: none; }
    .song-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1e2d45;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #3b82f6;
      font-weight: 700;
      flex-shrink: 0;
    }
    .song-num.active-song {
      background: #3b82f6;
      color: #fff;
    }
    .song-info { flex: 1; cursor: pointer; }
    .song-title { font-size: 0.9rem; font-weight: 500; color: #e2e8f0; margin-bottom: 2px; }
    .song-artist { font-size: 0.75rem; color: #4a5568; }
    .song-key {
      font-size: 0.7rem;
      color: #3b82f6;
      font-weight: 700;
      background: #1e2d45;
      border-radius: 4px;
      padding: 2px 7px;
      font-family: monospace;
    }
        .key-override { background: #1e3a1e; color: #4ade80; }
    .remove-btn {
      background: none;
      border: none;
      color: #4a5568;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
    }
    .remove-btn:hover { color: #ef4444; }
    .empty {
      text-align: center;
      color: #4a5568;
      padding: 4rem 2rem;
    }
    .empty i { font-size: 3rem; display: block; margin-bottom: 1rem; }
    .empty p { font-size: 0.9rem; margin-bottom: 1.5rem; }
    .empty-btn {
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 20px;

    }
    .bottom-nav {

      left: 0;
      right: 0;

      border-top: 1px solid #1e2d45;

    .nav-item {

    }

      border-top: 2px solid #3b82f6;

.group-banner { margin:0.75rem 1.25rem 0; padding:0.6rem 0.9rem; background:#0d1626; border:1px solid #1e2d45; border-left:3px solid #3b82f6; border-radius:8px; font-size:0.75rem; color:#94a3b8; }

    /* ===== GLASSMORPHISM + GRADIENT ===== */
    body {
      background: linear-gradient(135deg, #060b18 0%, #0b1628 35%, #0d0c20 65%, #13082a 100%) fixed !important;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(168,85,247,0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 10%, rgba(34,197,94,0.06) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    /* Navbar superior */
    .header, nav.header {
      background: rgba(8, 15, 28, 0.75) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      border-bottom: 1px solid rgba(59,130,246,0.15) !important;
    }
    /* Barra de transposición */
    .transpose-bar {
      background: rgba(10, 18, 35, 0.72) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border-bottom: 1px solid rgba(59,130,246,0.12) !important;
    }
    /* Nav inferior */
    .bottom-nav {
      background: rgba(8, 15, 28, 0.80) !important;
      backdrop-filter: blur(18px) saturate(160%) !important;
      -webkit-backdrop-filter: blur(18px) saturate(160%) !important;
      border-top: 1px solid rgba(59,130,246,0.13) !important;
    }
    /* Barra de búsqueda */
    .search-bar {
      background: rgba(10, 18, 38, 0.70) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border-bottom: 1px solid rgba(59,130,246,0.10) !important;
    }
    /* Tarjetas de canciones */
    .song-item {
      background: rgba(13, 22, 38, 0.55) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(59,130,246,0.10) !important;
      transition: background 0.2s, border-color 0.2s;
    }
    .song-item:hover, .song-item:active {
      background: rgba(20, 35, 60, 0.70) !important;
      border-color: rgba(59,130,246,0.25) !important;
    }
    /* Secciones de canción — mantienen borde de color, se vuelven translúcidas */
    .section {
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
    }
    .section.intro       { background: rgba(10, 31, 18, 0.55) !important; }
    .section.verso       { background: rgba(10, 18, 38, 0.55) !important; }
    .section.pre-coro    { background: rgba(31, 18, 10, 0.55) !important; }
    .section.coro        { background: rgba(19, 10, 38, 0.55) !important; }
    .section.vamp        { background: rgba(26, 10, 31, 0.55) !important; }
    .section.bridge      { background: rgba(31, 26, 10, 0.55) !important; }
    .section.instrumental{ background: rgba(20, 20, 20, 0.50) !important; }
    .section.outro       { background: rgba(31, 10, 10, 0.55) !important; }
    /* Modal / overlay */
    .modal {
      background: rgba(10, 18, 35, 0.85) !important;
      backdrop-filter: blur(20px) saturate(150%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(150%) !important;
      border: 1px solid rgba(59,130,246,0.18) !important;
    }
    /* FAB (paginación Opción A) */
    .fab {
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      box-shadow: 0 4px 20px rgba(59,130,246,0.35) !important;
    }
    /* Indicador de página */
    .page-indicator {
      background: rgba(13, 22, 38, 0.75) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(59,130,246,0.20) !important;
    }
    /* Toast */
    .toast {
      background: rgba(13, 22, 38, 0.90) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
    }
    /* Inputs en modales y búsqueda */
    .search-input-wrap, .modal-input {
      background: rgba(20, 32, 55, 0.60) !important;
      border: 1px solid rgba(59,130,246,0.15) !important;
    }
    /* Chips / badges de acordes */
    .key-display, .cifrado-toggle {
      background: rgba(30, 45, 69, 0.70) !important;
      backdrop-filter: blur(6px) !important;
      -webkit-backdrop-filter: blur(6px) !important;
    }
    /* Tarjetas genéricas de setlist / medley */
    .setlist-item, .medley-item, .group-item {
      background: rgba(13, 22, 38, 0.55) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(59,130,246,0.10) !important;
    }
    /* Banner de grupo */
    .group-banner {
      background: rgba(13, 22, 38, 0.60) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
    }
    /* Barra de contexto */
    .context-bar {
      background: rgba(13, 22, 38, 0.65) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border-bottom: 1px solid rgba(59,130,246,0.10) !important;
    }
    /* Barra "guardar alineación" */
    .save-align-bar {
      background: rgba(13, 22, 38, 0.85) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
    }
    /* ===== FIN GLASSMORPHISM ===== */
</style>

  <script>
    const _supabase = supabase.createClient(

    )
async function eliminarSetlist() {
if (!isLeader) { alert('Solo el lider puede eliminar el setlist.'); return }
      if (!confirm('¿Eliminar este setlist completo?')) return
      await _supabase.from('setlist_songs').delete().eq('setlist_id', setlistId)
      await _supabase.from('setlist').delete().eq('id', setlistId)
      window.location.href = '/setlist.html'
    }
    const params = new URLSearchParams(window.location.search)
    const setlistId = params.get('id')
    let songsOrdered = []
let userId = null
let isLeader = true
let groupId = null

    async function init() {
      const { data: { session } } = await _supabase.auth.getSession()
      if (!session) { window.location.href = '/login.html'; return }
userId = session.user.id
      cargarSetlist()
    }

    
function actualizarUIPermisos() {
  const btn = document.getElementById('btn-eliminar-setlist')
  if (btn) btn.style.display = isLeader ? '' : 'none'
  const btnAgregar = document.getElementById('btn-agregar-cancion')
  if (btnAgregar) btnAgregar.style.display = isLeader ? 'flex' : 'none'
  const banner = document.getElementById('group-banner')
  if (banner) {
    if (groupId && !isLeader) {
      banner.style.display = 'block'
      banner.textContent = 'Estas viendo el setlist del grupo. Solo el lider puede editarlo.'
    } else {
      banner.style.display = 'none'
    }
  }
}

let todasLasCanciones = []

async function abrirModalAgregar() {
  document.getElementById('modal-agregar').style.display = 'flex'
  document.getElementById('agregar-search').value = ''
  const lista = document.getElementById('agregar-lista')
  lista.innerHTML = '<div style="text-align:center;color:#4a5568;padding:2rem;font-size:0.85rem;">Cargando canciones...</div>'

  if (todasLasCanciones.length === 0) {
    const { data } = await _supabase.from('Songs').select('id, title, artist, "original key"').order('title')
    todasLasCanciones = data || []
  }
  renderizarCanciones(todasLasCanciones)
}

function cerrarModalAgregar() {
  document.getElementById('modal-agregar').style.display = 'none'
}

function filtrarCanciones(q) {
  const term = q.toLowerCase()
  const filtradas = term
    ? todasLasCanciones.filter(s => s.title.toLowerCase().includes(term) || (s.artist || '').toLowerCase().includes(term))
    : todasLasCanciones
  renderizarCanciones(filtradas)
}

function renderizarCanciones(songs) {
  const lista = document.getElementById('agregar-lista')
  const yaEnSetlist = new Set(songsOrdered.map(s => s.id))
  if (!songs.length) {
    lista.innerHTML = '<div style="text-align:center;color:#4a5568;padding:2rem;font-size:0.85rem;">Sin resultados</div>'
    return
  }
  lista.innerHTML = songs.map(s => {
    const yaEsta = yaEnSetlist.has(s.id)
    return `<div style="display:flex;align-items:center;gap:10px;padding:0.7rem 0;border-bottom:1px solid rgba(30,45,69,0.60);cursor:${yaEsta ? 'default' : 'pointer'}" onclick="${yaEsta ? '' : `agregarCancionAlSetlist(${s.id},'${s.title.replace(/'/g,"\\'")}',this)`}">
      <div style="flex:1;min-width:0;">
        <div style="font-size:0.88rem;color:${yaEsta ? '#4a5568' : '#e2e8f0'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.title}</div>
        <div style="font-size:0.73rem;color:#4a5568;">${s.artist || ''}</div>
      </div>
      <div style="font-size:0.7rem;font-weight:700;color:#3b82f6;background:rgba(30,45,69,0.80);border-radius:4px;padding:2px 6px;font-family:monospace;flex-shrink:0;">${s['original key'] || '?'}</div>
      <div style="flex-shrink:0;color:${yaEsta ? '#22c55e' : '#3b82f6'};font-size:1.1rem;">${yaEsta ? '<i class="ti ti-check"></i>' : '<i class="ti ti-plus"></i>'}</div>
    </div>`
  }).join('')
}

async function agregarCancionAlSetlist(songId, titulo, el) {
  el.onclick = null
  el.style.opacity = '0.5'
  const nextOrder = songsOrdered.length > 0 ? Math.max(...songsOrdered.map(s => s.order || 0)) + 1 : 1
  const { error } = await _supabase.from('setlist_songs').insert({ setlist_id: parseInt(setlistId), song_id: songId, order: nextOrder })
  if (error) {
    mostrarToast('Error al agregar')
    el.onclick = () => agregarCancionAlSetlist(songId, titulo, el)
    el.style.opacity = '1'
    return
  }
  mostrarToast(`✓ "${titulo}" agregado`)
  // Actualizar lista en memoria y re-renderizar chips
  await cargarSetlist()
  // Re-renderizar el modal con estado actualizado
  filtrarCanciones(document.getElementById('agregar-search').value)
}
async function cargarSetlist() {
      const { data: setlist } = await _supabase
        .from('setlist')
        .select('*')
        .eq('id', setlistId)
        .single()

      if (!setlist) { window.location.href = '/setlist.html'; return }

groupId = setlist.group_id || null
if (groupId) {
  const { data: grupo } = await _supabase.from('groups').select('leader_id').eq('id', groupId).single()
  isLeader = grupo ? grupo.leader_id === userId : false
} else {
  isLeader = true
}
actualizarUIPermisos()

      document.getElementById('setlist-title').textContent = setlist.name
      document.title = setlist.name

      if (setlist.date) {
        const fecha = new Date(setlist.date).toLocaleDateString('es-MX', {
          weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        })
        document.getElementById('setlist-date').textContent = fecha
      }

    function renderLista() {

        <div class="show-banner">

    function iniciarShow(index) {

      const itemId     = songsOrdered[index].itemId
      const allKeys    = songsOrdered.map(s => s.keyOverride || '').join(',')
      const keyForSong = songsOrdered[index].keyOverride || ''
      window.location.href = '/song.html?id=' + songId + '&setlist=' + setlistId + '&index=' + index + '&songs=' + songIds + '&itemids=' + itemIds + '&itemid=' + itemId + '&keys=' + encodeURIComponent(allKeys) + '&key=' + encodeURIComponent(keyForSong)
    }

    function initDragDrop() {
      const lista = document.querySelector('.songs-list')
      if (!lista) return
      let dragSrc = null

      lista.addEventListener('dragstart', e => {
        const card = e.target.closest('.song-card')
        if (!card) return
        dragSrc = card
        card.classList.add('dragging')
        e.dataTransfer.effectAllowed = 'move'
        e.dataTransfer.setData('text/plain', card.dataset.index)
      })

      lista.addEventListener('dragend', e => {
        const card = e.target.closest('.song-card')
        if (card) card.classList.remove('dragging')
        lista.querySelectorAll('.song-card').forEach(c => c.classList.remove('drag-over'))
      })

      lista.addEventListener('dragover', e => {
        e.preventDefault()
        e.dataTransfer.dropEffect = 'move'
        const card = e.target.closest('.song-card')
        lista.querySelectorAll('.song-card').forEach(c => c.classList.remove('drag-over'))
        if (card && card !== dragSrc) card.classList.add('drag-over')
      })

      lista.addEventListener('drop', e => {
        e.preventDefault()
        const card = e.target.closest('.song-card')
        if (!card || card === dragSrc) return
        lista.querySelectorAll('.song-card').forEach(c => c.classList.remove('drag-over'))

        const cards = [...lista.querySelectorAll('.song-card')]
        const srcIdx = cards.indexOf(dragSrc)
        const tgtIdx = cards.indexOf(card)

        // Reorder songsOrdered array

        // Re-render and save

        guardarOrden()

      lista.addEventListener('touchstart', e => {
        const handle = e.target.closest('.drag-handle')
        if (!handle) return
        touchCard = handle.closest('.song-card')
        if (!touchCard) return
        touchStartY = e.touches[0].clientY
        touchCard.classList.add('dragging')

        touchClone = touchCard.cloneNode(true)
        touchClone.style.cssText = 'position:fixed;left:0;right:0;z-index:9999;opacity:0.85;background:#111c2e;border-radius: 8px;pointer-events:none;'
        touchClone.style.top = touchCard.getBoundingClientRect().top + 'px'
        document.body.appendChild(touchClone)
        e.preventDefault()
      }, { passive: false })

      lista.addEventListener('touchmove', e => {
        if (!touchCard) return
        const dy = e.touches[0].clientY - touchStartY
        touchClone.style.top = (touchCard.getBoundingClientRect().top + dy) + 'px'

        const el = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY)
        const over = el?.closest('.song-card')
        lista.querySelectorAll('.song-card').forEach(c => c.classList.remove('drag-over'))
        if (over && over !== touchCard) over.classList.add('drag-over')
        e.preventDefault()
      }, { passive: false })

      lista.addEventListener('touchend', e => {
        if (!touchCard) return
        if (touchClone) { touchClone.remove(); touchClone = null }
        touchCard.classList.remove('dragging')

        const el = document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY)
        const target = el?.closest('.song-card')
        lista.querySelectorAll('.song-card').forEach(c => c.classList.remove('drag-over'))

        if (target && target !== touchCard) {
          const cards = [...lista.querySelectorAll('.song-card')]
          const srcIdx = cards.indexOf(touchCard)
          const tgtIdx = cards.indexOf(target)
          const moved = songsOrdered.splice(srcIdx, 1)[0]
          songsOrdered.splice(tgtIdx, 0, moved)
          renderLista()
          guardarOrden()
        }
        touchCard = null
      })
    }
