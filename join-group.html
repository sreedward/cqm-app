<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CQM">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<title>CQM - Unirse a un grupo</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #080c14;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #0d1626;
  border-bottom: 1px solid #1e2d45;
  padding: 1rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.back-btn { background: none; border: none; color: #3b82f6; font-size: 1.3rem; cursor: pointer; padding: 4px; display: flex; align-items: center; }
.header-title { font-size: 1rem; font-weight: 600; color: #e2e8f0; }
.content { padding: 1.5rem 1.25rem; flex: 1; }
.group-hero {
  text-align: center;
  padding: 1.5rem 1rem;
}
.group-hero .icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: #1e2d45; color: #a855f7;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; margin: 0 auto 1rem;
}
.group-hero h1 { font-size: 1.2rem; color: #e2e8f0; margin-bottom: 0.4rem; }
.group-hero p { font-size: 0.8rem; color: #4a5568; }
.section-label {
  font-size: 0.7rem; color: #4a5568; letter-spacing: 1.5px;
  text-transform: uppercase; margin: 1rem 0 0.75rem;
}
.role-option {
  display: flex; align-items: center; gap: 10px;
  padding: 0.7rem 0.25rem; border-bottom: 1px solid #1e2d45; font-size: 0.9rem;
}
.role-option input { width: 18px; height: 18px; }
.join-btn {
  width: 100%; margin-top: 1.5rem;
  background: #3b82f6; border: none; color: #fff;
  border-radius: 10px; padding: 0.9rem; font-size: 0.95rem; font-weight: 700; cursor: pointer;
}
.join-btn:disabled { opacity: 0.6; }
.status-box {
  text-align: center; padding: 2.5rem 1.5rem; color: #94a3b8; font-size: 0.9rem; line-height: 1.5;
}
.status-box i { font-size: 2rem; color: #4a5568; display: block; margin-bottom: 1rem; }
.go-btn {
  display: inline-block; margin-top: 1rem;
  background: #3b82f6; color: #fff; text-decoration: none;
  border-radius: 10px; padding: 0.7rem 1.5rem; font-weight: 600; font-size: 0.85rem;
}

    /* ===== GLASSMORPHISM + GRADIENT ===== */
    body {
      background: linear-gradient(135deg, #060b18 0%, #0b1628 35%, #0d0c20 65%, #13082a 100%) fixed !important;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(168,85,247,0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 10%, rgba(34,197,94,0.06) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    /* Navbar superior */
    .header, nav.header {
      background: rgba(8, 15, 28, 0.75) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      border-bottom: 1px solid rgba(59,130,246,0.15) !important;
    }
    /* Barra de transposición */
    .transpose-bar {
      background: rgba(10, 18, 35, 0.72) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border-bottom: 1px solid rgba(59,130,246,0.12) !important;
    }
    /* Nav inferior */
    .bottom-nav {
      background: rgba(8, 15, 28, 0.80) !important;
      backdrop-filter: blur(18px) saturate(160%) !important;
      -webkit-backdrop-filter: blur(18px) saturate(160%) !important;
      border-top: 1px solid rgba(59,130,246,0.13) !important;
    }
    /* Barra de búsqueda */
    .search-bar {
      background: rgba(10, 18, 38, 0.70) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border-bottom: 1px solid rgba(59,130,246,0.10) !important;
    }
    /* Tarjetas de canciones */
    .song-item {
      background: rgba(13, 22, 38, 0.55) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(59,130,246,0.10) !important;
      transition: background 0.2s, border-color 0.2s;
    }
    .song-item:hover, .song-item:active {
      background: rgba(20, 35, 60, 0.70) !important;
      border-color: rgba(59,130,246,0.25) !important;
    }
    /* Secciones de canción — mantienen borde de color, se vuelven translúcidas */
    .section {
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
    }
    .section.intro       { background: rgba(10, 31, 18, 0.55) !important; }
    .section.verso       { background: rgba(10, 18, 38, 0.55) !important; }
    .section.pre-coro    { background: rgba(31, 18, 10, 0.55) !important; }
    .section.coro        { background: rgba(19, 10, 38, 0.55) !important; }
    .section.vamp        { background: rgba(26, 10, 31, 0.55) !important; }
    .section.bridge      { background: rgba(31, 26, 10, 0.55) !important; }
    .section.instrumental{ background: rgba(20, 20, 20, 0.50) !important; }
    .section.outro       { background: rgba(31, 10, 10, 0.55) !important; }
    /* Modal / overlay */
    .modal {
      background: rgba(10, 18, 35, 0.85) !important;
      backdrop-filter: blur(20px) saturate(150%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(150%) !important;
      border: 1px solid rgba(59,130,246,0.18) !important;
    }
    /* FAB (paginación Opción A) */
    .fab {
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
      box-shadow: 0 4px 20px rgba(59,130,246,0.35) !important;
    }
    /* Indicador de página */
    .page-indicator {
      background: rgba(13, 22, 38, 0.75) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(59,130,246,0.20) !important;
    }
    /* Toast */
    .toast {
      background: rgba(13, 22, 38, 0.90) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
    }
    /* Inputs en modales y búsqueda */
    .search-input-wrap, .modal-input {
      background: rgba(20, 32, 55, 0.60) !important;
      border: 1px solid rgba(59,130,246,0.15) !important;
    }
    /* Chips / badges de acordes */
    .key-display, .cifrado-toggle {
      background: rgba(30, 45, 69, 0.70) !important;
      backdrop-filter: blur(6px) !important;
      -webkit-backdrop-filter: blur(6px) !important;
    }
    /* Tarjetas genéricas de setlist / medley */
    .setlist-item, .medley-item, .group-item {
      background: rgba(13, 22, 38, 0.55) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(59,130,246,0.10) !important;
    }
    /* Banner de grupo */
    .group-banner {
      background: rgba(13, 22, 38, 0.60) !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
    }
    /* Barra de contexto */
    .context-bar {
      background: rgba(13, 22, 38, 0.65) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border-bottom: 1px solid rgba(59,130,246,0.10) !important;
    }
    /* Barra "guardar alineación" */
    .save-align-bar {
      background: rgba(13, 22, 38, 0.85) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
    }
    /* ===== FIN GLASSMORPHISM ===== */
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="window.location.href='/groups.html'"><i class="ti ti-arrow-left"></i></button>
  <div class="header-title">Unirse a un grupo</div>
</header>

<div class="content" id="content">
  <div class="status-box"><i class="ti ti-loader"></i>Cargando invitación...</div>
</div>

<script>
const _supabase = supabase.createClient(
  'https://kzqnsbztfyhyyageuboz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6cW5zYnp0ZnloeXlhZ2V1Ym96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTgzOTQsImV4cCI6MjA5MTQ5NDM5NH0.n0scEJcx6tZ7IihDKxdr3R2LDipZhv2oDbxwLiLq53w'
)

const ROLE_OPTIONS = ['Cantante','Pianista','Pianista 2','Guitarrista','Guitarrista 2','Guitarrista 3','Bajista','Coristas','Violinista','Trompetista','Drummer']

const params = new URLSearchParams(window.location.search)
const code = (params.get('code') || '').trim()

let currentUser = null
let targetGroup = null

function renderStatus(iconClass, message, showGoBtn, groupId) {
  document.getElementById('content').innerHTML = `
    <div class="status-box">
      <i class="ti ${iconClass}"></i>
      ${message}
      ${showGoBtn ? `<div><a class="go-btn" href="/group-view.html?id=${groupId}">Ver grupo</a></div>` : ''}
    </div>
  `
}

async function init() {
  if (!code) { renderStatus('ti-alert-triangle', 'No se encontró un código de invitación válido.', false); return }

  const { data: { session } } = await _supabase.auth.getSession()
  if (!session) { window.location.href = '/login.html'; return }
  currentUser = session.user

  const { data, error } = await _supabase.rpc('get_group_by_invite_code', { p_code: code })

  if (error || !data || data.length === 0) {
    renderStatus('ti-alert-triangle', 'Este código de invitación no es válido o el grupo ya no existe.', false)
    return
  }

  targetGroup = data[0]

  const { data: existing } = await _supabase
    .from('group_members')
    .select('id')
    .eq('group_id', targetGroup.id)
    .eq('user_id', currentUser.id)
    .maybeSingle()

  if (existing) {
    renderStatus('ti-circle-check', `Ya eres miembro de <strong>${targetGroup.name}</strong>.`, true, targetGroup.id)
    return
  }

  document.getElementById('content').innerHTML = `
    <div class="group-hero">
      <div class="icon"><i class="ti ti-users"></i></div>
      <h1>${targetGroup.name}</h1>
      <p>Te han invitado a unirte a este grupo de alabanza</p>
    </div>
    <div class="section-label">¿Qué tocas o cantas? (puedes elegir varios)</div>
    <div id="role-options"></div>
    <button class="join-btn" id="join-btn" onclick="unirse()">Unirme al grupo</button>
  `
  document.getElementById('role-options').innerHTML = ROLE_OPTIONS.map(r => `
    <label class="role-option">
      <input type="checkbox" value="${r}">
      <span>${r}</span>
    </label>
  `).join('')
}

async function unirse() {
  const btn = document.getElementById('join-btn')
  btn.disabled = true
  btn.textContent = 'Uniendo...'

  const roles = Array.from(document.querySelectorAll('#role-options input:checked')).map(i => i.value)

  const { error } = await _supabase
    .from('group_members')
    .insert({ group_id: targetGroup.id, user_id: currentUser.id, roles })

  if (error) {
    alert('No se pudo completar la unión al grupo: ' + error.message)
    btn.disabled = false
    btn.textContent = 'Unirme al grupo'
    return
  }

  window.location.href = `/group-view.html?id=${targetGroup.id}`
}

init()
</script>
</body>
</html>
