<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CQM">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<title>CQM - Unirse a un grupo</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(150deg,#04060e 0%,#080d22 40%,#0b0617 70%,#040609 100%);
  background-attachment: fixed;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: rgba(4,6,18,0.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding: 1rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.back-btn { background: none; border: none; color: #5b5fcc; font-size: 1.3rem; cursor: pointer; padding: 4px; display: flex; align-items: center; }
.header-title { font-size: 1rem; font-weight: 600; color: #dce4f0; }
.content { padding: 1.5rem 1.25rem; flex: 1; }
.group-hero {
  text-align: center;
  padding: 1.5rem 1rem;
}
.group-hero .icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(255,255,255,0.06); color: #a855f7;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; margin: 0 auto 1rem;
}
.group-hero h1 { font-size: 1.2rem; color: #dce4f0; margin-bottom: 0.4rem; }
.group-hero p { font-size: 0.8rem; color: #3d4a66; }
.section-label {
  font-size: 0.7rem; color: #3d4a66; letter-spacing: 1.5px;
  text-transform: uppercase; margin: 1rem 0 0.75rem;
}
.role-option {
  display: flex; align-items: center; gap: 10px;
  padding: 0.7rem 0.25rem; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.9rem;
}
.role-option input { width: 18px; height: 18px; }
.join-btn {
  width: 100%; margin-top: 1.5rem;
  background: #5b5fcc; border: none; color: #fff;
  border-radius: 10px; padding: 0.9rem; font-size: 0.95rem; font-weight: 700; cursor: pointer;
}
.join-btn:disabled { opacity: 0.6; }
.status-box {
  text-align: center; padding: 2.5rem 1.5rem; color: #8896b3; font-size: 0.9rem; line-height: 1.5;
}
.status-box i { font-size: 2rem; color: #3d4a66; display: block; margin-bottom: 1rem; }
.go-btn {
  display: inline-block; margin-top: 1rem;
  background: #5b5fcc; color: #fff; text-decoration: none;
  border-radius: 10px; padding: 0.7rem 1.5rem; font-weight: 600; font-size: 0.85rem;
}

/* ── Cosmos Grain Texture ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
  background-size: 180px;
  opacity: 0.4;
  mix-blend-mode: overlay;
}

/* ── Cosmos Nav Pill ── */
.nav-item { position: relative; }
.nav-item.active i,
.nav-item.active span { color: #dce4f0; }
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 28px; height: 2.5px;
  border-radius: 0 0 3px 3px;
  background: #7c7fdc;
}

  </style>
</head>
<body>
<header>
  <button class="back-btn" onclick="window.location.href='/groups.html'"><i class="ti ti-arrow-left"></i></button>
  <div class="header-title">Unirse a un grupo</div>
</header>

<div class="content" id="content">
  <div class="status-box"><i class="ti ti-loader"></i>Cargando invitación...</div>
</div>

<script>
const _supabase = supabase.createClient(
  'https://kzqnsbztfyhyyageuboz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6cW5zYnp0ZnloeXlhZ2V1Ym96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTgzOTQsImV4cCI6MjA5MTQ5NDM5NH0.n0scEJcx6tZ7IihDKxdr3R2LDipZhv2oDbxwLiLq53w'
)

const ROLE_OPTIONS = ['Cantante','Pianista','Pianista 2','Guitarrista','Guitarrista 2','Guitarrista 3','Bajista','Coristas','Violinista','Trompetista','Drummer']

const params = new URLSearchParams(window.location.search)
const code = (params.get('code') || '').trim()

let currentUser = null
let targetGroup = null

function renderStatus(iconClass, message, showGoBtn, groupId) {
  document.getElementById('content').innerHTML = `
    <div class="status-box">
      <i class="ti ${iconClass}"></i>
      ${message}
      ${showGoBtn ? `<div><a class="go-btn" href="/group-view.html?id=${groupId}">Ver grupo</a></div>` : ''}
    </div>
  `
}

async function init() {
  if (!code) { renderStatus('ti-alert-triangle', 'No se encontró un código de invitación válido.', false); return }

  const { data: { session } } = await _supabase.auth.getSession()
  if (!session) { window.location.href = '/login.html'; return }
  currentUser = session.user

  const { data, error } = await _supabase.rpc('get_group_by_invite_code', { p_code: code })

  if (error || !data || data.length === 0) {
    renderStatus('ti-alert-triangle', 'Este código de invitación no es válido o el grupo ya no existe.', false)
    return
  }

  targetGroup = data[0]

  const { data: existing } = await _supabase
    .from('group_members')
    .select('id')
    .eq('group_id', targetGroup.id)
    .eq('user_id', currentUser.id)
    .maybeSingle()

  if (existing) {
    renderStatus('ti-circle-check', `Ya eres miembro de <strong>${targetGroup.name}</strong>.`, true, targetGroup.id)
    return
  }

  document.getElementById('content').innerHTML = `
    <div class="group-hero">
      <div class="icon"><i class="ti ti-users"></i></div>
      <h1>${targetGroup.name}</h1>
      <p>Te han invitado a unirte a este grupo de alabanza</p>
    </div>
    <div class="section-label">¿Qué tocas o cantas? (puedes elegir varios)</div>
    <div id="role-options"></div>
    <button class="join-btn" id="join-btn" onclick="unirse()">Unirme al grupo</button>
  `
  document.getElementById('role-options').innerHTML = ROLE_OPTIONS.map(r => `
    <label class="role-option">
      <input type="checkbox" value="${r}">
      <span>${r}</span>
    </label>
  `).join('')
}

async function unirse() {
  const btn = document.getElementById('join-btn')
  btn.disabled = true
  btn.textContent = 'Uniendo...'

  const roles = Array.from(document.querySelectorAll('#role-options input:checked')).map(i => i.value)

  const { error } = await _supabase
    .from('group_members')
    .insert({ group_id: targetGroup.id, user_id: currentUser.id, roles })

  if (error) {
    alert('No se pudo completar la unión al grupo: ' + error.message)
    btn.disabled = false
    btn.textContent = 'Unirme al grupo'
    return
  }

  window.location.href = `/group-view.html?id=${targetGroup.id}`
}

init()
</script>
</body>
</html>
