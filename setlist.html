<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CQM">

  <title>CQM - Setlist</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(150deg,#04060e 0%,#080d22 40%,#0b0617 70%,#040609 100%);
  background-attachment: fixed;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding-bottom: 70px;
    }
    header {
      background: rgba(4,6,18,0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-title { font-size: 1rem; font-weight: 600; color: #dce4f0; }
    .new-btn {
      background: linear-gradient(135deg,#5b5fcc,#7c7fdc);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .section-label {
      font-size: 0.7rem;
      color: #3d4a66;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0.75rem 1.25rem 0.25rem;
    }
    .setlist-card {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      margin: 0 1.25rem 0.75rem;
      overflow: hidden;
      cursor: pointer;
    }
    .setlist-card:active { opacity: 0.7; }
    .setlist-header {
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .setlist-name { font-size: 0.95rem; font-weight: 600; color: #dce4f0; }
    .setlist-date { font-size: 0.75rem; color: #3d4a66; margin-top: 2px; }
    .setlist-count {
      background: rgba(91,95,204,0.12);
      color: #5b5fcc;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .setlist-songs { padding: 0.5rem 1rem; }
    .setlist-song-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.5rem 0;
      border-bottom: 1px solid #0d1626;
    }
    .setlist-song-item:last-child { border-bottom: none; }
    .song-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #5b5fcc;
      font-weight: 700;
      flex-shrink: 0;
    }
    .song-name { font-size: 0.85rem; color: #dce4f0; flex: 1; }
    .song-key-tag {
      font-size: 0.7rem;
      color: #5b5fcc;
      font-weight: 700;
      background: rgba(91,95,204,0.12);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
    }
    .empty {
      text-align: center;
      color: #3d4a66;
      padding: 4rem 2rem;
    }
    .empty i { font-size: 3rem; display: block; margin-bottom: 1rem; }
    .empty p { font-size: 0.9rem; margin-bottom: 1.5rem; }
    .empty-btn {
      background: linear-gradient(135deg,#5b5fcc,#7c7fdc);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 20px;
      cursor: pointer;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(5,7,16,0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      padding: 8px 0 12px;
      z-index: 20;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 0;
      text-decoration: none;
    }
    .nav-item i { font-size: 1.2rem; color: #3d4a66; }
    .nav-item span { font-size: 0.6rem; color: #3d4a66; letter-spacing: 0.5px; }
    .nav-item.active i { color: #dce4f0; }
    .nav-item.active span { color: #dce4f0; }

    /* Modal nueva setlist */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: rgba(4,6,18,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px 16px 0 0;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
    }
    .modal h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; color: #dce4f0; }
    .modal-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #dce4f0;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 1rem;
    }
    .modal-input:focus { border-color: #5b5fcc; }
    .modal-btns { display: flex; gap: 0.75rem; }
    .modal-cancel {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 8px;
      color: #888;
      padding: 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .modal-save {
      flex: 1;
      background: linear-gradient(135deg,#5b5fcc,#7c7fdc);
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
  
.context-bar { display:flex; gap:8px; padding:0.75rem 1.25rem 0.25rem; overflow-x:auto; }
.context-chip { flex-shrink:0; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius:20px; padding:6px 14px; font-size:0.75rem; color:#8896b3; cursor:pointer; white-space:nowrap; }
.context-chip.active { background: #5b5fcc; border-color: #5b5fcc; color:#fff; font-weight:600; }
.group-banner { margin:0 1.25rem 0.5rem; padding:0.6rem 0.9rem; background: rgba(91,95,204,0.08); border: 1px solid rgba(255,255,255,0.07); border-left: 3px solid rgba(91,95,204,0.5); border-radius:8px; font-size:0.75rem; color:#8896b3; }

/* ── Cosmos Grain Texture ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
  background-size: 180px;
  opacity: 0.4;
  mix-blend-mode: overlay;
}

/* ── Cosmos Nav Pill ── */
.nav-item { position: relative; }
.nav-item.active i,
.nav-item.active span { color: #dce4f0; }
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 28px; height: 2.5px;
  border-radius: 0 0 3px 3px;
  background: #7c7fdc;
}

  </style>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(e => console.error('[SW]', e));
      });

  </script>
</head>
<body>
  <header>
    <div class="header-title">Mis Setlists</div>
    <button class="new-btn" id="btn-nueva" onclick="abrirModal()">
      <i class="ti ti-plus"></i> Nueva
    </button>
  </header>

  <div class="context-bar" id="context-bar"></div>
<div class="group-banner" id="group-banner" style="display:none"></div>
<div id="contenido">
    <div class="section-label">Cargando...</div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="/library.html">
      <i class="ti ti-music"></i>
      <span>Canciones</span>
    </a>
    <a class="nav-item active" href="/setlist.html">
      <i class="ti ti-list-check"></i>
      <span>Setlist</span>

    <a class="nav-item" href="/medleys.html">
      <i class="ti ti-layers-intersect"></i>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3>Nueva Setlist</h3>
      <input class="modal-input" type="text" id="setlist-name" placeholder="Nombre (ej: Domingo 22 Jun)">
      <input class="modal-input" type="date" id="setlist-date">
      <div class="modal-btns">
        <button class="modal-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="modal-save" onclick="crearSetlist()">Crear</button>
      </div>
    </div>
  </div>

  <script>
    const _supabase = supabase.createClient(
      'https://kzqnsbztfyhyyageuboz.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6cW5zYnp0ZnloeXlhZ2V1Ym96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTgzOTQsImV4cCI6MjA5MTQ5NDM5NH0.n0scEJcx6tZ7IihDKxdr3R2LDipZhv2oDbxwLiLq53w'
    )

const KEY_COLORS = {
  'C': {bg:'rgba(239,68,68,0.13)',bd:'rgba(239,68,68,0.3)',tx:'#f87171'},
  'C#':{bg:'rgba(239,68,68,0.1)', bd:'rgba(239,68,68,0.25)',tx:'#f87171'},
  'Db':{bg:'rgba(239,68,68,0.1)', bd:'rgba(239,68,68,0.25)',tx:'#f87171'},
  'D': {bg:'rgba(249,115,22,0.13)',bd:'rgba(249,115,22,0.3)',tx:'#fb923c'},
  'D#':{bg:'rgba(249,115,22,0.1)',bd:'rgba(249,115,22,0.25)',tx:'#fb923c'},
  'Eb':{bg:'rgba(249,115,22,0.1)',bd:'rgba(249,115,22,0.25)',tx:'#fb923c'},
  'E': {bg:'rgba(234,179,8,0.13)', bd:'rgba(234,179,8,0.3)', tx:'#facc15'},
  'F': {bg:'rgba(34,197,94,0.12)', bd:'rgba(34,197,94,0.3)', tx:'#4ade80'},
  'F#':{bg:'rgba(34,197,94,0.1)', bd:'rgba(34,197,94,0.25)',tx:'#4ade80'},
  'Gb':{bg:'rgba(34,197,94,0.1)', bd:'rgba(34,197,94,0.25)',tx:'#4ade80'},
  'G': {bg:'rgba(20,184,166,0.13)',bd:'rgba(20,184,166,0.3)',tx:'#2dd4bf'},
  'G#':{bg:'rgba(20,184,166,0.1)',bd:'rgba(20,184,166,0.25)',tx:'#2dd4bf'},
  'Ab':{bg:'rgba(91,95,204,0.13)', bd:'rgba(91,95,204,0.3)', tx:'#818cf8'},
  'A': {bg:'rgba(59,130,246,0.13)',bd:'rgba(59,130,246,0.3)',tx:'#60a5fa'},
  'A#':{bg:'rgba(139,92,246,0.1)',bd:'rgba(139,92,246,0.25)',tx:'#a78bfa'},
  'Bb':{bg:'rgba(139,92,246,0.1)',bd:'rgba(139,92,246,0.25)',tx:'#a78bfa'},
  'B': {bg:'rgba(168,85,247,0.13)',bd:'rgba(168,85,247,0.3)',tx:'#c084fc'},
}
function keyColor(k){ return KEY_COLORS[k] || {bg:'rgba(91,95,204,0.12)',bd:'rgba(91,95,204,0.3)',tx:'#7c7fdc'} }

    let userId = null
let currentGroupId = null
let userGroups = []
let isLeaderOfCurrent = true

    async function init() {
      const { data: { session } } = await _supabase.auth.getSession()
      if (!session) { window.location.href = '/login.html'; return }
      userId = session.user.id
      await cargarGrupos()
      cargarSetlists()
    }

    
async function cargarGrupos() {
  const { data: memberships } = await _supabase.from('group_members').select('group_id').eq('user_id', userId)
  userGroups = []
  if (memberships && memberships.length > 0) {
    const groupIds = memberships.map(m => m.group_id)
    const { data: groups } = await _supabase.from('groups').select('id, name, leader_id').in('id', groupIds)
    if (groups) {
      userGroups = groups.map(g => ({ id: g.id, name: g.name, isLeader: g.leader_id === userId }))
    }
  }
  renderContextBar()
}

function renderContextBar() {
  const bar = document.getElementById('context-bar')
  if (!bar) return
  if (userGroups.length === 0) { bar.style.display = "none"; actualizarUIPermisos(); return }
  bar.style.display = "flex"
  let chips = '<div class="context-chip ' + (currentGroupId === null ? "active" : "") + '" onclick="cambiarContexto(null)">Personal</div>'
  for (const g of userGroups) {
    const activa = (String(currentGroupId) === String(g.id)) ? "active" : ""
    chips += '<div class="context-chip ' + activa + '" onclick="cambiarContexto(\'' + g.id + '\')">' + g.name + '</div>'
  }
  bar.innerHTML = chips
}

function cambiarContexto(groupId) {
  currentGroupId = groupId === null ? null : groupId
  const g = userGroups.find(x => String(x.id) === String(groupId))
  isLeaderOfCurrent = currentGroupId === null ? true : (g ? g.isLeader : false)
  renderContextBar()
  actualizarUIPermisos()
  cargarSetlists()
}

function actualizarUIPermisos() {
  const btn = document.getElementById('btn-nueva')
  if (btn) btn.style.display = isLeaderOfCurrent ? "flex" : "none"
  const banner = document.getElementById('group-banner')
  if (banner) {
    if (currentGroupId !== null && !isLeaderOfCurrent) {
      banner.style.display = "block"
      banner.textContent = "Estas viendo el contenido del grupo. Solo el lider puede crear o modificar setlists."
    } else {
      banner.style.display = "none"
    }
  }
}
async function cargarSetlists() {
      let queryBuilder = _supabase.from('setlist').select('*')
      if (currentGroupId === null) {
        queryBuilder = queryBuilder.eq('user_id', userId).is('group_id', null)
      } else {
        queryBuilder = queryBuilder.eq('group_id', currentGroupId)
      }
      const { data: setlists, error } = await queryBuilder.order('created_at', { ascending: false })

      const contenido = document.getElementById('contenido')

      if (error || !setlists || setlists.length === 0) {
        contenido.innerHTML = `
          <div class="empty">
            <i class="ti ti-list-check"></i>
            <p>Aún no tienes setlists.<br>Crea uno para tu próximo show.</p>
            ${isLeaderOfCurrent ? '<button class="empty-btn" onclick="abrirModal()">+ Crear Setlist</button>' : ''}
          </div>`
        return
      }

      let html = `<div class="section-label">${setlists.length} setlist${setlists.length !== 1 ? 's' : ''}</div>`

      for (const s of setlists) {
        const { data: songs } = await _supabase
          .from('setlist_songs')
          .select('order, song_id')
          .eq('setlist_id', s.id)
          .order('order')

        const songIds = songs ? songs.map(x => x.song_id) : []
        let songDetails = []

        if (songIds.length > 0) {
          const { data: details } = await _supabase
            .from('Songs')
            .select('id, title, "original key"')
            .in('id', songIds)
          songDetails = details || []
        }

        const songsOrdered = songs ? songs.map(s => songDetails.find(d => d.id === s.song_id)).filter(Boolean) : []
        const fecha = s.date ? new Date(s.date).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }) : ''

        html += `
          <div class="setlist-card" onclick="window.location.href='/setlist-view.html?id=${s.id}'">
            <div class="setlist-header">
              <div>
                <div class="setlist-name">${s.name}</div>
                ${fecha ? `<div class="setlist-date">${fecha}</div>` : ''}
              </div>
              <div class="setlist-count">${songsOrdered.length} canciones</div>
            </div>
            ${songsOrdered.length > 0 ? `
              <div class="setlist-songs">
                ${songsOrdered.slice(0, 4).map((song, i) => `
                  <div class="setlist-song-item">
                    <div class="song-num">${i + 1}</div>
                    <div class="song-name">${song.title}</div>
                    <div class="song-key-tag">${song['original key'] || '?'}</div>
                  </div>
                `).join('')}
                ${songsOrdered.length > 4 ? `<div style="font-size:0.75rem;color:#3d4a66;padding:0.4rem 0">+${songsOrdered.length - 4} más...</div>` : ''}
              </div>` : ''}
          </div>`
      }

      contenido.innerHTML = html
    }

    function abrirModal() {
      if (!isLeaderOfCurrent) { return }
      document.getElementById('modal').classList.add('show')
      document.getElementById('setlist-date').value = new Date().toISOString().split('T')[0]
    }

    function cerrarModal() {
      document.getElementById('modal').classList.remove('show')
      document.getElementById('setlist-name').value = ''
    }

    async function crearSetlist() {
      if (!isLeaderOfCurrent) { alert('Solo el lider del grupo puede crear setlists.'); return }
      const name = document.getElementById('setlist-name').value.trim()
      const date = document.getElementById('setlist-date').value

      if (!name) {
        alert('Por favor ponle un nombre al setlist.')
        return
      }

      const { error } = await _supabase
        .from('setlist')
        .insert({ name, date, user_id: userId, group_id: currentGroupId })

      if (error) {
        alert('Error creando setlist: ' + error.message)
        return
      }

      cerrarModal()
      cargarSetlists()
    }

    init()
  </script>
</body>
</html>
