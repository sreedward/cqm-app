    async function abrirModalSetlist() {
      document.getElementById('modal-setlist').classList.add('show')
      const { data: { session } } = await _supabase.auth.getSession()
      const { data: setlists } = await _supabase.from('setlist').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false })
      const container = document.getElementById('setlist-opciones')
      if (!setlists || setlists.length === 0) {
        container.innerHTML = '<div style="color:#4a5568;font-size:0.85rem;text-align:center;padding:1rem">No tienes setlists. <a href="/setlist.html" style="color:#3b82f6">Crea uno primero.</a></div>'
        return
      }
      container.innerHTML = setlists.map(s => `
        <div class="setlist-opcion" onclick="agregarASetlist(${s.id}, '${s.name}')">
          <div><div class="opcion-name">${s.name}</div>${s.date ? `<div class="opcion-date">${new Date(s.date).toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'})}</div>` : ''}</div>
          <i class="ti ti-plus opcion-add"></i>
        </div>`).join('')
    }

    function cerrarModalSetlist() {
      document.getElementById('modal-setlist').classList.remove('show')

    async function agregarASetlist(setlistId, setlistName) {
      const { data: existing } = await _supabase.from('setlist_songs').select('id').eq('setlist_id', setlistId).eq('song_id', songId)
      if (existing && existing.length > 0) { mostrarToast('Ya estÃ¡ en este setlist'); cerrarModalSetlist(); return }
      const { data: songs } = await _supabase.from('setlist_songs').select('order').eq('setlist_id', setlistId).order('order', { ascending: false }).limit(1)
      const nextOrder = songs && songs.length > 0 ? songs[0].order + 1 : 1
      const { error } = await _supabase.from('setlist_songs').insert({ setlist_id: setlistId, song_id: parseInt(songId), order: nextOrder })
      if (error) { mostrarToast('Error al agregar') } else { mostrarToast(`â Agregado a "${setlistName}"`); cerrarModalSetlist() }
    }

    async function guardarTonalidad() {
if (groupId && !isLeaderOfGroup) { mostrarToast('Solo el lider puede guardar la tonalidad del grupo'); return }
      if (!setlistId || !songId) return
      const rootIdx    = NOTAS.indexOf(originalKey)
      const currentKey = NOTAS[(rootIdx + semitones + 12) % 12]

      // UPDATE bloqueado por RLS â usar DELETE + INSERT
      // Primero leer el registro actual para obtener setlist_id, song_id, order
      let setlistIdNum = parseInt(setlistId)
      let songIdNum    = parseInt(songId)
      let currentItemId = setlistItemId ? parseInt(setlistItemId) : null

      let currentRecord = null
      if (currentItemId) {
        const { data: rec } = await _supabase.from('setlist_songs').select('*').eq('id', currentItemId).single()
        currentRecord = rec
      } else {
        const { data: rec } = await _supabase.from('setlist_songs').select('*').eq('setlist_id', setlistIdNum).eq('song_id', songIdNum).single()
        currentRecord = rec
      }

      if (!currentRecord) {
        mostrarToast('Error: registro no encontrado')
        return
      }

      // DELETE el registro actual
      await _supabase.from('setlist_songs').delete().eq('id', currentRecord.id)

      // INSERT nuevo registro con key_override
      const { data: inserted, error } = await _supabase.from('setlist_songs').insert({
        setlist_id:   currentRecord.setlist_id,
        song_id:      currentRecord.song_id,
        order:        currentRecord.order,
        key_override: currentKey
      }).select().single()

      if (error) {
        mostrarToast('Error al guardar: ' + error.message)
      } else {
        mostrarToast('Tonalidad ' + currentKey + ' guardada')
        // Actualizar setlistItemId con el nuevo id del registro insertado
        setlistItemId = String(inserted.id)
        // Actualizar itemIdsParam con el nuevo id
        const itemsArr = itemIdsParam ? itemIdsParam.split(',') : setlistSongs.map(() => '')
        itemsArr[setlistIndex] = String(inserted.id)
        itemIdsParam = itemsArr.join(',')
        // Actualizar keys en memoria
        const keysArr = keysParam ? keysParam.split(',') : setlistSongs.map(() => '')
        keysArr[setlistIndex] = currentKey
        const newKeys = keysArr.join(',')
        keysParam = newKeys
        keyParam  = currentKey
        const newUrl = '/song.html?id=' + songId + '&setlist=' + setlistId + '&index=' + setlistIndex + '&songs=' + setlistSongs.join(',') + '&itemids=' + encodeURIComponent(itemIdsParam) + '&itemid=' + encodeURIComponent(setlistItemId) + '&keys=' + encodeURIComponent(newKeys) + '&key=' + encodeURIComponent(currentKey)
        history.replaceState(null, '', newUrl)
      }
    }

    function mostrarToast(msg) {
      const toast = document.getElementById('toast')
      toast.textContent = msg
      toast.style.display = 'block'
      setTimeout(() => { toast.style.display = 'none' }, 2500)
    }

              segs.push({ chord: pendingChord, chordRaw: pendingChordRaw, lyric: txt.slice(0, sp + 1) })
              const rest = txt.slice(sp + 1)
              if (rest) segs.push({ chord: null, lyric: rest })
            }
            pendingChord = null; pendingChordRaw = null
          } else {
            segs.push({ chord: null, lyric: txt })
          }
        }
        const inner = m[1].trim()
        if (!inner) { pos = m.index + m[0].length; continue }
        if (esNota(inner)) {
          segs.push({ annotation: inner })
        } else {
          pendingChord = traducirAcorde(inner)
          pendingChordRaw = inner
        }
        pos = m.index + m[0].length
      }
      // Trailing text or dangling chord
      const rem = line.slice(pos)
      if (rem || pendingChord !== null) {
        segs.push({ chord: pendingChord, chordRaw: pendingChordRaw, lyric: rem || '' })
      }
      // Chord-only line (no real lyric content)
      const hasLyrics = segs.some(s => s.lyric && s.lyric.trim())
      if (!hasLyrics && !segs.some(s => s.annotation)) {
        const ch = segs.filter(s => s.chord).map(s => styledChord(s.chord)).join('  ')
        return '<div class="line"><div class="chords">' + ch + '</div></div>'
      }
      let notasHTML = ''
      const html = segs.map((s, ci) => {
        if (s.annotation) { notasHTML += renderNota(s.annotation); return '' }
        const lyric = s.lyric || ''
        if (!s.chord) {
          return '<span style="display:inline-block;vertical-align:bottom;white-space:pre;font-size:0.95rem;color:#cbd5e1;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif">' + escHtml(lyric) + '</span>'
        }
        const altCifrado = cifrado === 'nashville' ? 'americano' : 'nashville'
        const altChord = s.chordRaw ? traducirAcorde(s.chordRaw, altCifrado) : s.chord
        const cw = Math.max(s.chord.length + 1, altChord ? altChord.length + 1 : 0)
        const lw = Math.max(lyric.length, 1)
        const mw = Math.max(cw, lw)
        const key = sectionId + ':' + lineIndex + ':' + ci
        const off = ((offsets || {})[lineIndex + ':' + ci] || 0)
        return '<span style="display:inline-block;vertical-align:bottom;text-align:left;min-width:' + mw + 'ch;font-family:monospace">' +
          '<span class="chord-row chord-row-draggable" data-key="' + key + '" data-offset="' + off + '" style="display:block;font-family:monospace;font-size:1rem;font-weight:700;color:#facc15;min-height:1.3em;white-space:pre;transform:translateX(' + off + 'px)">' + styledChord(s.chord) + ' </span>' +
          '<span style="display:block;font-size:0.95rem;color:#cbd5e1;white-space:pre;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif">' + escHtml(lyric) + '</span>' +
          '</span>'
      }).join('')
      return '<div class="line" style="line-height:1;margin-bottom:0.75rem">' + html + '</div>' + notasHTML
    }

    function onChordPointerDown(e) {
      if (!alignMode) return
      const el = e.target.closest('.chord-row-draggable')
      if (!el) return
      e.preventDefault()
      const key = el.dataset.key
      const parts = key.split(':')
      const sectionId = Number(parts[0])
      const startOffset = parseFloat(el.dataset.offset) || 0
      dragState = { el, key, sectionId, startX: e.clientX, startOffset, currentOffset: startOffset, dragging: false }
      el.setPointerCapture(e.pointerId)
      el.addEventListener('pointermove', onChordPointerMove)
      el.addEventListener('pointerup', onChordPointerUp)
      el.addEventListener('pointercancel', onChordPointerCancel)
    }

    function onChordPointerCancel(e) {
      if (!dragState || dragState.el !== e.currentTarget) return
      dragState.el.style.transform = 'translateX(' + dragState.startOffset + 'px)'
      dragState.el.dataset.offset = dragState.startOffset
      dragState.el.removeEventListener('pointermove', onChordPointerMove)
      dragState.el.removeEventListener('pointerup', onChordPointerUp)
      dragState.el.removeEventListener('pointercancel', onChordPointerCancel)
      dragState = null
    }

    function onChordPointerMove(e) {
      if (!dragState || dragState.el !== e.currentTarget) return
      const delta = e.clientX - dragState.startX
      if (!dragState.dragging) {
        if (Math.abs(delta) < 3) return
        dragState.dragging = true
      }
      const proposedOffset = Math.round(dragState.startOffset + delta)
      dragState.el.style.transform = 'translateX(' + proposedOffset + 'px)'
      const r = dragState.el.getBoundingClientRect()
      let finalOffset = proposedOffset
      if (r.left < 0) finalOffset += Math.ceil(-r.left)
      else if (r.right > window.innerWidth) finalOffset -= Math.ceil(r.right - window.innerWidth)
      if (finalOffset !== proposedOffset) dragState.el.style.transform = 'translateX(' + finalOffset + 'px)'
      dragState.el.dataset.offset = finalOffset
      dragState.currentOffset = finalOffset
    }

    function onChordPointerUp(e) {
      if (!dragState || dragState.el !== e.currentTarget) return
      if (dragState.dragging) {
        const finalOffset = dragState.currentOffset
        const offsets = getSectionOffsets(dragState.sectionId)
        const parts = dragState.key.split(':')
        const localKey = parts[1] + ':' + parts[2]
        if (finalOffset) { offsets[localKey] = finalOffset } else { delete offsets[localKey] }
        const bar = document.getElementById('save-align-bar')
        const barLabel = bar.querySelector('span')
        if (barLabel) barLabel.textContent = isAdmin ? 'Ajustando acordes (para todos)' : 'Ajustando acordes (solo para ti)'
        bar.classList.add('show')
      }
      dragState.el.removeEventListener('pointermove', onChordPointerMove)
      dragState.el.removeEventListener('pointerup', onChordPointerUp)
      dragState.el.removeEventListener('pointercancel', onChordPointerCancel)
      dragState = null
    }

    async function abrirModalSetlist() {
      document.getElementById('modal-setlist').classList.add('show')
      const { data: { session } } = await _supabase.auth.getSession()
      const { data: setlists } = await _supabase.from('setlist').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false })
      const container = document.getElementById('setlist-opciones')
      if (!setlists || setlists.length === 0) {
        container.innerHTML = '<div style="color:#4a5568;font-size:0.85rem;text-align:center;padding:1rem">No tienes setlists. <a href="/setlist.html" style="color:#3b82f6">Crea uno primero.</a></div>'
        return
      }
      container.innerHTML = setlists.map(s => `
        <div class="setlist-opcion" onclick="agregarASetlist(${s.id}, '${s.name}')">
          <div><div class="opcion-name">${s.name}</div>${s.date ? `<div class="opcion-date">${new Date(s.date).toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'})}</div>` : ''}</div>
          <i class="ti ti-plus opcion-add"></i>
        </div>`).join('')
    }

    function cerrarModalSetlist() {
      document.getElementById('modal-setlist').classList.remove('show')
    }

    async function agregarASetlist(setlistId, setlistName) {
      const { data: existing } = await _supabase.from('setlist_songs').select('id').eq('setlist_id', setlistId).eq('song_id', songId)
      if (existing && existing.length > 0) { mostrarToast('Ya estÃ¡ en este setlist'); cerrarModalSetlist(); return }
      const { data: songs } = await _supabase.from('setlist_songs').select('order').eq('setlist_id', setlistId).order('order', { ascending: false }).limit(1)
      const nextOrder = songs && songs.length > 0 ? songs[0].order + 1 : 1
      const { error } = await _supabase.from('setlist_songs').insert({ setlist_id: setlistId, song_id: parseInt(songId), order: nextOrder })
      if (error) { mostrarToast('Error al agregar') } else { mostrarToast(`â Agregado a "${setlistName}"`); cerrarModalSetlist() }
    }

    async function guardarTonalidad() {
if (groupId && !isLeaderOfGroup) { mostrarToast('Solo el lider puede guardar la tonalidad del grupo'); return }
      if (!setlistId || !songId) return
      const rootIdx    = NOTAS.indexOf(originalKey)
      const currentKey = NOTAS[(rootIdx + semitones + 12) % 12]

      // UPDATE bloqueado por RLS â usar DELETE + INSERT
      // Primero leer el registro actual para obtener setlist_id, song_id, order
      let setlistIdNum = parseInt(setlistId)
      let songIdNum    = parseInt(songId)
      let currentItemId = setlistItemId ? parseInt(setlistItemId) : null

      let currentRecord = null
      if (currentItemId) {
        const { data: rec } = await _supabase.from('setlist_songs').select('*').eq('id', currentItemId).single()
        currentRecord = rec
      } else {
        const { data: rec } = await _supabase.from('setlist_songs').select('*').eq('setlist_id', setlistIdNum).eq('song_id', songIdNum).single()
        currentRecord = rec
      }

      if (!currentRecord) {
        mostrarToast('Error: registro no encontrado')
        return
      }

      // DELETE el registro actual
      await _supabase.from('setlist_songs').delete().eq('id', currentRecord.id)

      // INSERT nuevo registro con key_override
      const { data: inserted, error } = await _supabase.from('setlist_songs').insert({
        setlist_id:   currentRecord.setlist_id,
        song_id:      currentRecord.song_id,
        order:        currentRecord.order,
        key_override: currentKey
      }).select().single()

      if (error) {
        mostrarToast('Error al guardar: ' + error.message)
      } else {
        mostrarToast('Tonalidad ' + currentKey + ' guardada')
        // Actualizar setlistItemId con el nuevo id del registro insertado
        setlistItemId = String(inserted.id)
        // Actualizar itemIdsParam con el nuevo id
        const itemsArr = itemIdsParam ? itemIdsParam.split(',') : setlistSongs.map(() => '')
        itemsArr[setlistIndex] = String(inserted.id)
        itemIdsParam = itemsArr.join(',')
        // Actualizar keys en memoria
        const keysArr = keysParam ? keysParam.split(',') : setlistSongs.map(() => '')
        keysArr[setlistIndex] = currentKey
        const newKeys = keysArr.join(',')
        keysParam = newKeys
        keyParam  = currentKey
        const newUrl = '/song.html?id=' + songId + '&setlist=' + setlistId + '&index=' + setlistIndex + '&songs=' + setlistSongs.join(',') + '&itemids=' + encodeURIComponent(itemIdsParam) + '&itemid=' + encodeURIComponent(setlistItemId) + '&keys=' + encodeURIComponent(newKeys) + '&key=' + encodeURIComponent(currentKey)
        history.replaceState(null, '', newUrl)
      }
    }

    function mostrarToast(msg) {
      const toast = document.getElementById('toast')
      toast.textContent = msg
      toast.style.display = 'block'
      setTimeout(() => { toast.style.display = 'none' }, 2500)
    }

    updateHeaderHeight()
    window.addEventListener('resize', updateHeaderHeight)
    init()
  </script>
</body>
</html>
