<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(150deg,#04060e 0%,#080d22 40%,#0b0617 70%,#040609 100%);
  background-attachment: fixed; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; padding-bottom: 90px; }
header { background: rgba(4,6,18,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 1rem 1.25rem; display: flex; align-items: center; gap: 0.75rem; position: sticky; top: 0; z-index: 10; }
.back-btn { background: none; border: none; color: #5b5fcc; font-size: 1.3rem; cursor: pointer; padding: 4px; display: flex; align-items: center; }
.header-info { flex: 1; }
.page-title { font-size: 0.95rem; font-weight: 700; color: #dce4f0; }
.page-sub { font-size: 0.72rem; color: #3d4a66; }
.new-btn { background: linear-gradient(135deg,#5b5fcc,#7c7fdc); border: none; border-radius: 8px; color: #fff; font-size: 0.8rem; font-weight: 600; padding: 7px 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; text-decoration: none; white-space: nowrap; }
.new-btn:hover { background: #4b4fbc; }
.content { padding: 1rem 1.25rem; }
.loading { text-align: center; color: #3d4a66; padding: 3rem 1rem; font-size: 0.9rem; }
.empty-state { text-align: center; padding: 3rem 1.5rem; }
.empty-icon { font-size: 3rem; color: rgba(255,255,255,0.06); margin-bottom: 1rem; display: block; }
.empty-title { color: #3d4a66; font-size: 0.95rem; margin-bottom: 0.5rem; }
.empty-sub { color: #2a3a50; font-size: 0.8rem; margin-bottom: 1.5rem; }
.empty-cta { background: linear-gradient(135deg,#5b5fcc,#7c7fdc); border: none; border-radius: 10px; color: #fff; font-size: 0.85rem; font-weight: 600; padding: 10px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.section-label { font-size: 0.7rem; color: #3d4a66; letter-spacing: 1.5px; text-transform: uppercase; padding: 0.75rem 0 0.4rem; }
.medley-card { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.07); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.85rem; }
.medley-card-link { flex: 1; display: flex; align-items: center; gap: 0.85rem; cursor: pointer; text-decoration: none; min-width: 0; }
.medley-card:hover { border-color: #5b5fcc; }
.medley-icon { width: 42px; height: 42px; background: rgba(91,95,204,0.12); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.medley-icon i { font-size: 1.2rem; color: #5b5fcc; }
.medley-info { flex: 1; min-width: 0; }
.medley-name { font-size: 0.95rem; font-weight: 600; color: #dce4f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.medley-meta { font-size: 0.72rem; color: #3d4a66; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.meta-chip { display: flex; align-items: center; gap: 3px; }
.meta-chip i { font-size: 0.75rem; }
.medley-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.action-btn { background: none; border: none; color: #3d4a66; font-size: 1rem; cursor: pointer; padding: 7px; border-radius: 6px; display: flex; align-items: center; }
.action-btn:hover { background: rgba(255,255,255,0.07); }
.action-btn.del:hover { color: #ef4444; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,7,16,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(255,255,255,0.06); display: flex; padding: 8px 0 12px; z-index: 20; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 0; text-decoration: none; }
.nav-item i { font-size: 1.2rem; color: #3d4a66; }
.nav-item span { font-size: 0.6rem; color: #3d4a66; letter-spacing: 0.5px; }
.nav-item.active i, .nav-item.active span { color: #dce4f0; }
.toast { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.06); border: 1px solid #5b5fcc; color: #dce4f0; border-radius: 8px; padding: 0.6rem 1.25rem; font-size: 0.85rem; z-index: 60; display: none; white-space: nowrap; }
.confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(8,12,20,0.85); z-index: 50; align-items: flex-end; justify-content: center; }
.confirm-overlay.open { display: flex; }
.confirm-sheet { background: rgba(4,6,18,0.92); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px 16px 0 0; padding: 1.5rem 1.25rem 2rem; width: 100%; max-width: 480px; }
.confirm-title { font-size: 1rem; font-weight: 700; color: #dce4f0; margin-bottom: 0.35rem; }
.confirm-sub { font-size: 0.82rem; color: #3d4a66; margin-bottom: 1.25rem; }
.confirm-btns { display: flex; gap: 0.75rem; }
.confirm-btns button { flex: 1; border: none; border-radius: 10px; padding: 0.75rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
.btn-cancel { background: rgba(255,255,255,0.06); color: #dce4f0; }
.btn-delete { background: rgba(239,68,68,0.8); color: #fff; }

.context-bar { display:flex; gap:8px; padding:0 0 0.5rem; overflow-x:auto; }
.context-chip { flex-shrink:0; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius:20px; padding:6px 14px; font-size:0.75rem; color:#8896b3; cursor:pointer; white-space:nowrap; }
.context-chip.active { background:#5b5fcc; border-color:#5b5fcc; color:#fff; font-weight:600; }
.group-banner { margin:0 0 0.75rem; padding:0.6rem 0.9rem; background: rgba(91,95,204,0.08); border: 1px solid rgba(255,255,255,0.07); border-left: 3px solid rgba(91,95,204,0.5); border-radius:8px; font-size:0.75rem; color:#8896b3; }

/* ── Cosmos Grain Texture ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
  background-size: 180px;
  opacity: 0.4;
  mix-blend-mode: overlay;
}

/* ── Cosmos Nav Pill ── */
.nav-item { position: relative; }
.nav-item.active i,
.nav-item.active span { color: #dce4f0; }
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 28px; height: 2.5px;
  border-radius: 0 0 3px 3px;
  background: #7c7fdc;
}

  </style>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(e) { console.error('[SW]', e); });
  });
}
</script>
</head>
<body>
<header>
  <button class="back-btn" onclick="history.back()"><i class="ti ti-arrow-left"></i></button>
  <div class="header-info">
    <div class="page-title">Mis Medleys</div>
    <div class="page-sub" id="page-sub">Cargando...</div>
  </div>
  <a class="new-btn" id="btn-nuevo-medley" href="/medley-builder.html"><i class="ti ti-plus"></i> Nuevo</a>
</header>
<div class="context-bar" id="context-bar"></div><div class="group-banner" id="group-banner" style="display:none"></div><div class="content" id="content">
  <div class="loading"><i class="ti ti-loader-2" style="font-size:1.5rem;display:block;margin-bottom:0.5rem"></i>Cargando medleys...</div>
</div>
<nav class="bottom-nav">
  <a class="nav-item" href="/library.html"><i class="ti ti-home"></i><span>Inicio</span></a>
  <a class="nav-item" href="/setlist.html"><i class="ti ti-list-check"></i><span>Setlist</span></a>
  <a class="nav-item active" href="/medleys.html"><i class="ti ti-layers-intersect"></i><span>Medley</span></a>
  <a class="nav-item" href="/more.html"><i class="ti ti-dots-circle-horizontal"></i><span>Más</span></a>
</nav>
<div class="toast" id="toast"></div>
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-sheet">
    <div class="confirm-title">Eliminar medley</div>
    <div class="confirm-sub" id="confirm-sub">Esta acción no se puede deshacer.</div>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">Cancelar</button>
      <button class="btn-delete" id="btn-confirm-del">Eliminar</button>
    </div>
  </div>
</div>
<script>
var _sb = supabase.createClient(
  'https://kzqnsbztfyhyyageuboz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6cW5zYnp0ZnloeXlhZ2V1Ym96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTgzOTQsImV4cCI6MjA5MTQ5NDM5NH0.n0scEJcx6tZ7IihDKxdr3R2LDipZhv2oDbxwLiLq53w'
);
var allMedleys = [];
var userId = null;
var currentGroupId = null;
var userGroups = [];
var isLeaderOfCurrent = true;

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('es', { day: '2-digit', month: 'short', year: 'numeric' });
}

function renderMedleys(list) {
  var el = document.getElementById('content');
  var sub = document.getElementById('page-sub');
  sub.textContent = list.length + ' medley' + (list.length !== 1 ? 's' : '') + ' guardados';
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><i class="ti ti-layers-intersect empty-icon"></i><div class="empty-title">Aún no tienes medleys</div><div class="empty-sub">Crea tu primer medley combinando secciones de canciones.</div><a class="empty-cta" href="/medley-builder.html"><i class="ti ti-plus"></i> Crear medley</a></div>';
    return;
  }
  el.innerHTML = '<div class="section-label">Tus medleys</div>';
  list.forEach(function(m) {
    var card = document.createElement('div');
    card.className = 'medley-card';
    card.dataset.id = m.id;
    var secCount = m.sec_count || 0;
    card.innerHTML =
      '<a class="medley-card-link" href="/medley-view.html?id=' + m.id + '">' +
        '<div class="medley-icon"><i class="ti ti-layers-intersect"></i></div>' +
        '<div class="medley-info">' +
          '<div class="medley-name">' + escHtml(m.name) + '</div>' +
          '<div class="medley-meta">' +
            '<span class="meta-chip"><i class="ti ti-list"></i>&nbsp;' + secCount + ' sección' + (secCount !== 1 ? 'es' : '') + '</span>' +
            '<span class="meta-chip"><i class="ti ti-calendar"></i>&nbsp;' + formatDate(m.created_at) + '</span>' +
          '</div>' +
        '</div>' +
      '</a>' +
      '<div class="medley-actions">' +
        (isLeaderOfCurrent ? '<button class="action-btn del" data-action="delete" data-id="' + m.id + '" data-name="' + escHtml(m.name) + '" title="Eliminar"><i class="ti ti-trash"></i></button>' : '') +
      '</div>';
    el.appendChild(card);
  });
}

// Event delegation for delete buttons
document.getElementById('content').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action="delete"]');
  if (btn) {
    e.preventDefault();
    e.stopPropagation();
    confirmDelete(parseInt(btn.dataset.id), btn.dataset.name);
  }
});

var pendingDeleteId = null;

function confirmDelete(id, name) {
if (!isLeaderOfCurrent) { return }
  pendingDeleteId = id;
  document.getElementById('confirm-sub').textContent = '¿Eliminar "' + name + '"? Esta acción no se puede deshacer.';
  document.getElementById('confirm-overlay').classList.add('open');
  document.getElementById('btn-confirm-del').onclick = function() { doDelete(id); };
}

function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
  pendingDeleteId = null;
}

async function doDelete(id) {
  closeConfirm();
  await _sb.from('medley_sections').delete().eq('medley_id', id);
  var res = await _sb.from('medleys').delete().eq('id', id);
  if (res.error) { mostrarToast('✕ Error al eliminar'); return; }
  allMedleys = allMedleys.filter(function(m) { return m.id !== id; });
  renderMedleys(allMedleys);
  mostrarToast('✓ Medley eliminado');
}

function mostrarToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2500);
}

document.getElementById('confirm-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeConfirm();
});


function renderContextBar() {
  var bar = document.getElementById('context-bar')
  if (!bar) return
  if (userGroups.length === 0) { bar.style.display = "none"; actualizarUIPermisos(); return }
  bar.style.display = "flex"
  var chips = '<div class="context-chip ' + (currentGroupId === null ? "active" : "") + '" onclick="cambiarContexto(null)">Personal</div>'
  userGroups.forEach(function(g) {
    var activa = (String(currentGroupId) === String(g.id)) ? "active" : ""
    chips += '<div class="context-chip ' + activa + '" onclick="cambiarContexto(\'' + g.id + '\')">' + escHtml(g.name) + '</div>'
  })
  bar.innerHTML = chips
}

async function cargarGrupos() {
  var memRes = await _sb.from('group_members').select('group_id').eq('user_id', userId)
  var memberships = memRes.data || []
  userGroups = []
  if (memberships.length > 0) {
    var groupIds = memberships.map(function(m) { return m.group_id })
    var grpRes = await _sb.from('groups').select('id, name, leader_id').in('id', groupIds)
    var groups = grpRes.data || []
    userGroups = groups.map(function(g) { return { id: g.id, name: g.name, isLeader: g.leader_id === userId } })
  }
  renderContextBar()
}

function cambiarContexto(gid) {
  currentGroupId = gid === null ? null : gid
  var g = null
  userGroups.forEach(function(x) { if (String(x.id) === String(gid)) g = x })
  isLeaderOfCurrent = currentGroupId === null ? true : (g ? g.isLeader : false)
  renderContextBar()
  actualizarUIPermisos()
  cargarMedleys()
}

function actualizarUIPermisos() {
  var btn = document.getElementById('btn-nuevo-medley')
  if (btn) {
    btn.style.display = isLeaderOfCurrent ? '' : 'none'
    btn.setAttribute('href', currentGroupId === null ? '/medley-builder.html' : '/medley-builder.html?group=' + currentGroupId)
  }
  var banner = document.getElementById('group-banner')
  if (banner) {
    if (currentGroupId !== null && !isLeaderOfCurrent) {
      banner.style.display = "block"
      banner.textContent = "Estas viendo los medleys del grupo. Solo el lider puede crear o eliminar."
    } else {
      banner.style.display = "none"
    }
  }
}

async function cargarMedleys() {
  var queryBuilder = _sb.from('medleys').select('id, name, created_at')
  if (currentGroupId === null) {
    queryBuilder = queryBuilder.eq('user_id', userId).is('group_id', null)
  } else {
    queryBuilder = queryBuilder.eq('group_id', currentGroupId)
  }
  var medRes = await queryBuilder.order('created_at', { ascending: false })
  if (medRes.error) {
    document.getElementById("content").innerHTML = '<div class="loading">Error cargando medleys</div>'
    return
  }
  var medleys = medRes.data || []
  if (!medleys.length) { allMedleys = []; renderMedleys([]); return }
  var ids = medleys.map(function(m) { return m.id })
  var secRes = await _sb.from('medley_sections').select('medley_id').in('medley_id', ids)
  var countMap = {}
  ;(secRes.data || []).forEach(function(r) {
    countMap[r.medley_id] = (countMap[r.medley_id] || 0) + 1
  })
  allMedleys = medleys.map(function(m) {
    return { id: m.id, name: m.name, created_at: m.created_at, sec_count: countMap[m.id] || 0 }
  })
  renderMedleys(allMedleys)
}
async function init() {
  var authRes = await _sb.auth.getSession();
  var session = authRes.data.session;
  if (!session) { window.location.href = '/login.html'; return; }
  userId = session.user.id;
await cargarGrupos();
actualizarUIPermisos();
cargarMedleys();
}

init();
</script>
</body>
</html>
