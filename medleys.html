<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080c14">
<title>Medleys — CQM</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#080c14; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; padding-bottom:80px; }
header { background:#0d1626; border-bottom:1px solid #1e2d45; padding:.85rem 1rem; display:flex; align-items:center; gap:.6rem; position:sticky; top:0; z-index:10; }
.back-btn { background:none; border:none; color:#3b82f6; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; }
.header-title { font-size:.95rem; font-weight:600; color:#e2e8f0; flex:1; }
.new-btn { background:#3b82f6; border:none; border-radius:8px; color:#fff; padding:6px 14px; font-size:.8rem; font-weight:600; cursor:pointer; }
.container { padding:1rem; max-width:480px; margin:0 auto; }
.medley-item { background:#0d1626; border:1px solid #1e2d45; border-radius:12px; padding:1rem; margin-bottom:.75rem; cursor:pointer; }
.medley-item:active { opacity:.8; }
.medley-title { font-size:.95rem; font-weight:600; color:#e2e8f0; margin-bottom:.3rem; }
.medley-meta { font-size:.75rem; color:#4a5568; }
.medley-songs { font-size:.75rem; color:#64748b; margin-top:.4rem; }
.empty { text-align:center; color:#4a5568; padding:3rem 1rem; }
.loading { text-align:center; color:#4a5568; padding:2rem; }
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:flex-end; justify-content:center; }
.modal-bg.open { display:flex; }
.modal { background:#0d1626; border:1px solid #1e2d45; border-radius:16px 16px 0 0; padding:1.25rem; width:100%; max-width:480px; max-height:80vh; overflow-y:auto; }
.modal h3 { font-size:1rem; font-weight:700; color:#e2e8f0; margin-bottom:1rem; }
.form-group { margin-bottom:.9rem; }
.form-group label { display:block; font-size:.72rem; color:#4a5568; margin-bottom:.35rem; letter-spacing:.5px; }
input, textarea { width:100%; background:#111d33; border:1px solid #1e2d45; border-radius:8px; padding:.65rem .9rem; color:#e2e8f0; font-size:.88rem; outline:none; font-family:inherit; }
input:focus, textarea:focus { border-color:#3b82f6; }
.modal-actions { display:flex; gap:.6rem; margin-top:1rem; }
.modal-actions button { flex:1; padding:.7rem; border-radius:8px; cursor:pointer; font-size:.85rem; border:none; font-weight:600; }
.btn-cancel { background:#1e2d45; color:#94a3b8; }
.btn-save { background:#3b82f6; color:#fff; }
.song-search-list { max-height:160px; overflow-y:auto; margin-top:.4rem; }
.song-option { display:flex; align-items:center; gap:.6rem; padding:.5rem .6rem; border-radius:8px; cursor:pointer; }
.song-option:hover { background:#1e2d45; }
.song-option input[type=checkbox] { accent-color:#3b82f6; width:16px; height:16px; }
.song-option-label { font-size:.85rem; color:#e2e8f0; }
.song-option-sub { font-size:.72rem; color:#4a5568; }
.selected-songs { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem; }
.song-chip { background:#1e2d45; border:none; border-radius:6px; color:#94a3b8; font-size:.75rem; padding:3px 8px; cursor:pointer; }
.drag-handle { color:#4a5568; cursor:grab; margin-right:.4rem; font-size:1rem; }
.sort-item { display:flex; align-items:center; padding:.4rem .5rem; border-radius:8px; background:#111d33; margin-bottom:.3rem; font-size:.85rem; color:#e2e8f0; }
.sort-item.dragging { opacity:.5; }
.btn-delete { background:#1a0808; border:1px solid #7f1d1d; color:#ef4444; border-radius:8px; padding:.55rem .9rem; font-size:.8rem; cursor:pointer; flex:none; }
.error-msg { color:#f87171; font-size:.78rem; margin-top:.3rem; display:none; }
.success-toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#0d2b19; border:1px solid #166534; color:#4ade80; padding:.6rem 1.2rem; border-radius:10px; font-size:.82rem; z-index:200; opacity:0; transition:opacity .3s; pointer-events:none; }
.success-toast.show { opacity:1; }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#0d1626; border-top:1px solid #1e2d45; display:flex; z-index:50; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; padding:.6rem .2rem .4rem; color:#4a5568; font-size:.62rem; cursor:pointer; gap:.2rem; text-decoration:none; }
.nav-item.active { color:#3b82f6; }
.nav-item i { font-size:1.3rem; }

/* ===== GLASSMORPHISM + GRADIENT ===== */
body {
  background: linear-gradient(135deg, #060b18 0%, #0b1628 35%, #0d0c20 65%, #13082a 100%) fixed !important;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(168,85,247,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 10%, rgba(34,197,94,0.06) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}
body > * { position: relative; z-index: 1; }
.header, nav.header {
  background: rgba(8, 15, 28, 0.75) !important;
  backdrop-filter: blur(16px) saturate(180%) !important;
  -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
  border-bottom: 1px solid rgba(59,130,246,0.15) !important;
}
.bottom-nav {
  background: rgba(8, 15, 28, 0.80) !important;
  backdrop-filter: blur(18px) saturate(160%) !important;
  -webkit-backdrop-filter: blur(18px) saturate(160%) !important;
  border-top: 1px solid rgba(59,130,246,0.13) !important;
}
.medley-item {
  background: rgba(13, 22, 38, 0.55) !important;
  backdrop-filter: blur(10px) !important;
  -webkit-backdrop-filter: blur(10px) !important;
  border: 1px solid rgba(59,130,246,0.10) !important;
  transition: background 0.2s, border-color 0.2s;
}
.medley-item:hover, .medley-item:active {
  background: rgba(20, 35, 60, 0.70) !important;
  border-color: rgba(59,130,246,0.25) !important;
}
.modal {
  background: rgba(10, 18, 35, 0.95) !important;
  backdrop-filter: blur(20px) saturate(150%) !important;
  -webkit-backdrop-filter: blur(20px) saturate(150%) !important;
  border: 1px solid rgba(59,130,246,0.18) !important;
}
/* ===== FIN GLASSMORPHISM ===== */
</style>
</head>
<body>
<header>
  <button class="back-btn" onclick="history.back()"><i class="ti ti-arrow-left"></i></button>
  <span class="header-title">Medleys</span>
  <button class="new-btn" onclick="abrirNuevo()">+ Nuevo</button>
</header>

<div class="container">
  <div id="lista"><div class="loading">Cargando...</div></div>
</div>

<!-- MODAL CREAR/EDITAR -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title">Nuevo medley</h3>
    <div class="form-group">
      <label>NOMBRE DEL MEDLEY</label>
      <input type="text" id="m-nombre" placeholder="Ej: Medley de adoración">
    </div>
    <div class="form-group">
      <label>CANCIONES (buscar y seleccionar)</label>
      <input type="text" id="m-buscar" placeholder="Buscar canción..." oninput="filtrarCanciones()">
      <div class="song-search-list" id="m-lista-canciones"></div>
    </div>
    <div class="form-group" id="orden-group" style="display:none">
      <label>ORDEN DE CANCIONES</label>
      <div id="m-orden"></div>
    </div>
    <div class="form-group">
      <label>NOTAS DEL MEDLEY (opcional)</label>
      <textarea id="m-notas" rows="2" placeholder="Notas, instrucciones..."></textarea>
    </div>
    <div class="error-msg" id="m-error">Ingresa un nombre y al menos una canción.</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-delete" id="btn-del" style="display:none" onclick="eliminarMedley()">Eliminar</button>
      <button class="btn-save" onclick="guardarMedley()">Guardar</button>
    </div>
  </div>
</div>

<div class="success-toast" id="toast"></div>

<nav class="bottom-nav">
  <a class="nav-item" href="/library.html"><i class="ti ti-music"></i>Biblioteca</a>
  <a class="nav-item" href="/setlists.html"><i class="ti ti-list"></i>Setlists</a>
  <a class="nav-item active" href="/medleys.html"><i class="ti ti-layers-intersect"></i>Medleys</a>
  <a class="nav-item" href="/profile.html"><i class="ti ti-user"></i>Perfil</a>
</nav>

<script>
const _sb = supabase.createClient(
  'https://kzqnsbztfyhyyageuboz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6cW5zYnp0ZnloeXlhZ2V1Ym96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTgzOTQsImV4cCI6MjA5MTQ5NDM5NH0.n0scEJcx6tZ7IihDKxdr3R2LDipZhv2oDbxwLiLq53w'
)
let todasCanciones = [], seleccionadas = [], editandoId = null

async function init() {
  const { data: { session } } = await _sb.auth.getSession()
  if (!session) { window.location.href = '/login.html'; return }
  const { data: songs } = await _sb.from('Songs').select('id,title,artist').order('title')
  todasCanciones = songs || []
  await cargarMedleys()
}

async function cargarMedleys() {
  const { data: medleys } = await _sb.from('medleys').select('*').order('created_at', { ascending: false })
  const el = document.getElementById('lista')
  if (!medleys || medleys.length === 0) {
    el.innerHTML = '<div class="empty">No hay medleys todavía.<br>Crea uno con el botón "+".</div>'
    return
  }
  el.innerHTML = medleys.map(m => {
    const songs = (m.song_ids || []).map(id => {
      const s = todasCanciones.find(x => x.id === id)
      return s ? s.title : ''
    }).filter(Boolean)
    const preview = songs.slice(0, 2).join(' • ') + (songs.length > 2 ? ` +${songs.length - 2} más` : '')
    const n = songs.length
    const label = n === 1 ? '1 sección' : `${n} secciones`
    return `<div class="medley-item" onclick="abrirEditar('${m.id}')">
      <div class="medley-title">${m.name}</div>
      <div class="medley-meta">${label}</div>
      ${preview ? `<div class="medley-songs">${preview}</div>` : ''}
    </div>`
  }).join('')
}

function abrirNuevo() {
  editandoId = null
  seleccionadas = []
  document.getElementById('modal-title').textContent = 'Nuevo medley'
  document.getElementById('m-nombre').value = ''
  document.getElementById('m-notas').value = ''
  document.getElementById('m-buscar').value = ''
  document.getElementById('btn-del').style.display = 'none'
  document.getElementById('m-error').style.display = 'none'
  renderCanciones()
  renderOrden()
  document.getElementById('modal').classList.add('open')
}

async function abrirEditar(id) {
  const { data: m } = await _sb.from('medleys').select('*').eq('id', id).single()
  if (!m) return
  editandoId = id
  seleccionadas = m.song_ids || []
  document.getElementById('modal-title').textContent = 'Editar medley'
  document.getElementById('m-nombre').value = m.name || ''
  document.getElementById('m-notas').value = m.notes || ''
  document.getElementById('m-buscar').value = ''
  document.getElementById('btn-del').style.display = 'block'
  document.getElementById('m-error').style.display = 'none'
  renderCanciones()
  renderOrden()
  document.getElementById('modal').classList.add('open')
}

function cerrarModal() { document.getElementById('modal').classList.remove('open') }

function filtrarCanciones() { renderCanciones() }

function renderCanciones() {
  const q = document.getElementById('m-buscar').value.toLowerCase()
  const filtradas = todasCanciones.filter(s =>
    s.title.toLowerCase().includes(q) || (s.artist || '').toLowerCase().includes(q)
  )
  document.getElementById('m-lista-canciones').innerHTML = filtradas.map(s => `
    <label class="song-option">
      <input type="checkbox" ${seleccionadas.includes(s.id) ? 'checked' : ''}
        onchange="toggleSong('${s.id}', this.checked)">
      <div>
        <div class="song-option-label">${s.title}</div>
        <div class="song-option-sub">${s.artist || ''}</div>
      </div>
    </label>
  `).join('')
  renderOrden()
}

function toggleSong(id, checked) {
  if (checked) { if (!seleccionadas.includes(id)) seleccionadas.push(id) }
  else { seleccionadas = seleccionadas.filter(x => x !== id) }
  renderOrden()
}

function renderOrden() {
  const group = document.getElementById('orden-group')
  const el = document.getElementById('m-orden')
  if (seleccionadas.length < 2) { group.style.display = 'none'; return }
  group.style.display = 'block'
  el.innerHTML = seleccionadas.map((id, i) => {
    const s = todasCanciones.find(x => x.id === id)
    return `<div class="sort-item" draggable="true" data-id="${id}"
      ondragstart="dragStart(event,${i})" ondragover="dragOver(event)" ondrop="drop(event,${i})">
      <span class="drag-handle">↕</span>${s ? s.title : id}
    </div>`
  }).join('')
}

let dragIdx = null
function dragStart(e, i) { dragIdx = i; e.currentTarget.classList.add('dragging') }
function dragOver(e) { e.preventDefault() }
function drop(e, i) {
  e.preventDefault()
  if (dragIdx === null || dragIdx === i) return
  const arr = [...seleccionadas]
  const [moved] = arr.splice(dragIdx, 1)
  arr.splice(i, 0, moved)
  seleccionadas = arr
  dragIdx = null
  renderOrden()
}

async function guardarMedley() {
  const nombre = document.getElementById('m-nombre').value.trim()
  const notas = document.getElementById('m-notas').value.trim()
  if (!nombre || seleccionadas.length === 0) {
    document.getElementById('m-error').style.display = 'block'; return
  }
  document.getElementById('m-error').style.display = 'none'
  const payload = { name: nombre, song_ids: seleccionadas, notes: notas }
  let err
  if (editandoId) {
    const { error } = await _sb.from('medleys').update(payload).eq('id', editandoId)
    err = error
  } else {
    const { data: { session } } = await _sb.auth.getSession()
    const { error } = await _sb.from('medleys').insert({ ...payload, created_by: session.user.id })
    err = error
  }
  if (err) { alert('Error: ' + err.message); return }
  cerrarModal()
  await cargarMedleys()
  showToast(editandoId ? 'Medley actualizado' : 'Medley creado')
}

async function eliminarMedley() {
  if (!editandoId) return
  if (!confirm('¿Eliminar este medley?')) return
  const { error } = await _sb.from('medleys').delete().eq('id', editandoId)
  if (error) {
    showToast('✕ Error al eliminar', true); return
  }
  cerrarModal()
  await cargarMedleys()
  showToast('✓ Medley eliminado')
}

function showToast(msg, err = false) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.style.background = err ? '#2b0a0a' : '#0d2b19'
  t.style.borderColor = err ? '#7f1d1d' : '#166534'
  t.style.color = err ? '#f87171' : '#4ade80'
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2500)
}

init()
</script>
</body>
</html>
