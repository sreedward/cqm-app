<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CQM">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<title>Mis Medleys — CQM</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(135deg, #060b18 0%, #0b1628 35%, #0d0c20 65%, #13082a 100%) fixed;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding-bottom: calc(94px + env(safe-area-inset-bottom, 12px));
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 80%, rgba(168,85,247,0.08) 0%, transparent 55%);
  pointer-events: none; z-index: 0;
}
body > * { position: relative; z-index: 1; }

/* ── Header ── */
header {
  background: rgba(8,15,28,0.82);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(59,130,246,0.14);
  padding: 0.85rem 1rem 0.6rem;
  position: sticky; top: 0; z-index: 20;
}
.hdr-row { display: flex; align-items: center; gap: 0.5rem; }
.back-btn { background: none; border: none; color: #3b82f6; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; padding: 2px; }
.page-title { font-size: 1.08rem; font-weight: 750; color: #f8fafc; flex: 1; letter-spacing: -0.02em; }
.page-sub { font-size: 0.7rem; color: #64748b; margin-top: 0.12rem; }
.header-create { width: 34px; height: 34px; border: 1px solid rgba(96,165,250,.4); border-radius: 11px; background: linear-gradient(135deg,#2563eb,#7c3aed); color: #fff; display: grid; place-items: center; font-size: 1.15rem; cursor: pointer; box-shadow: 0 8px 22px rgba(59,130,246,.2); }

/* Scope switcher: personal medleys and accessible groups */
.scope-wrap { padding: .8rem 1rem .25rem; }
.scope-label { color: #64748b; font-size: .63rem; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; margin-bottom: .48rem; }
.scope-tabs { display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; padding-bottom: .1rem; }
.scope-tabs::-webkit-scrollbar { display: none; }
.scope-btn { border: 1px solid rgba(71,85,105,.5); background: rgba(13,22,38,.62); color: #94a3b8; border-radius: 12px; padding: .55rem .8rem; min-width: max-content; display: flex; align-items: center; gap: .42rem; font: 600 .72rem inherit; cursor: pointer; }
.scope-btn i { color: #60a5fa; font-size: .95rem; }
.scope-btn.active { color: #fff; border-color: rgba(96,165,250,.55); background: linear-gradient(135deg,rgba(37,99,235,.3),rgba(124,58,237,.22)); box-shadow: inset 0 0 22px rgba(59,130,246,.08), 0 7px 20px rgba(0,0,0,.18); }

/* ── Search ── */
.search-wrap { padding: 0.6rem 1rem 0.3rem; }
.search-inner { position: relative; }
.search-inner i { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: #475569; font-size: 0.95rem; pointer-events: none; }
.search-input {
  width: 100%; background: rgba(13,22,38,0.70); border: 1px solid #1e2d45;
  border-radius: 10px; padding: 0.5rem 0.85rem 0.5rem 2.1rem;
  color: #e2e8f0; font-size: 0.82rem; font-family: inherit; outline: none;
}
.search-input::placeholder { color: #475569; }
.search-input:focus { border-color: rgba(59,130,246,0.4); }

/* ── Filter tabs ── */
.filter-tabs { display: flex; gap: 0.45rem; padding: 0.3rem 1rem 0.6rem; overflow-x: auto; scrollbar-width: none; }
.filter-tabs::-webkit-scrollbar { display: none; }
.ftab {
  background: none; border: 1px solid #1e2d45; border-radius: 20px;
  color: #64748b; padding: 4px 14px; font-size: 0.72rem; font-weight: 500;
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.ftab.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }

/* ── Grid ── */
.grid {
  padding: 0 0.75rem 1rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.65rem;
}

/* ── Medley card ── */
.mcard {
  background: rgba(10,18,35,0.72);
  border: 1.5px solid rgba(30,45,70,0.8);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  cursor: pointer;
  transition: border-color 0.18s, box-shadow 0.18s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.mcard:hover {
  border-color: rgba(59,130,246,0.42);
  box-shadow: 0 0 0 1px rgba(59,130,246,0.16), 0 4px 18px rgba(59,130,246,0.10);
}

/* Thumbnail */
.mcard-thumb {
  height: 82px;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
/* Brillo sutil en la parte superior */
.mcard-thumb::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 40%;
  background: linear-gradient(to bottom, rgba(255,255,255,0.08), transparent);
  pointer-events: none; z-index: 1;
}
/* Título dentro del thumb */
.thumb-title {
  position: relative; z-index: 2;
  padding: 0 10px;
  text-align: center;
  font-size: 0.78rem;
  font-weight: 700;
  color: rgba(255,255,255,0.92);
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  letter-spacing: 0.2px;
}
.thumb-tracks { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; gap: 3px; z-index: 2; pointer-events: none; }
.thumb-track { height: 7px; flex: 1; border-radius: 4px; background: rgba(255,255,255,0.22); pointer-events: none; }

/* Card body */
.mcard-body { padding: 0.55rem 0.65rem 0.6rem; flex: 1; display: flex; flex-direction: column; gap: 0.16rem; }
.mcard-title { font-size: 0.8rem; font-weight: 700; color: #e2e8f0; line-height: 1.2; margin-bottom: 0.2rem; }
.mcard-song { display: flex; align-items: center; gap: 0.28rem; font-size: 0.67rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard-song i { font-size: 0.68rem; color: #475569; flex-shrink: 0; }
.more-chip {
  display: inline-block; background: rgba(59,130,246,0.13); color: #60a5fa;
  border-radius: 4px; padding: 1px 6px; font-size: 0.6rem; font-weight: 600;
  margin-top: 0.18rem; align-self: flex-start;
}
.mcard-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.38rem; }
.mcard-count { font-size: 0.68rem; font-weight: 600; color: #3b82f6; }
/* El contenido visual deja el click al enlace nativo de la tarjeta. */
.mcard-thumb, .mcard-body, .mcard-title, .mcard-song,
.mcard-song span, .mcard-song i, .thumb-title, .more-chip,
.mcard-footer, .mcard-count {
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}
.mcard-menu-btn {
  background: none; border: none; color: #475569; font-size: 0.9rem;
  cursor: pointer; padding: 2px 4px; line-height: 1;
  pointer-events: all;
  position: absolute;
  right: 0.55rem;
  bottom: 0.48rem;
  z-index: 5;
}
.mcard-menu-btn:hover { color: #94a3b8; }

/* ── Context menu ── */
.ctx-menu {
  position: fixed; z-index: 200;
  background: #0d1a2e;
  border: 1px solid #1e2d45;
  border-radius: 10px;
  padding: 0.3rem 0;
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  min-width: 140px;
  display: none;
}
.ctx-menu.open { display: block; }
.ctx-item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.55rem 0.9rem; font-size: 0.8rem; color: #94a3b8;
  cursor: pointer; transition: background 0.12s;
}
.ctx-item:hover { background: #1e2d45; color: #e2e8f0; }
.ctx-item.danger { color: #f87171; }
.ctx-item.danger:hover { background: #1a0808; }
.ctx-item i { font-size: 0.95rem; }

/* ── New card ── */
.mcard-new {
  background: rgba(10,18,35,0.40);
  border: 1.5px dashed #1e2d45;
  border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.42rem; min-height: 140px; cursor: pointer;
  color: #475569; transition: border-color 0.15s, color 0.15s;
  text-decoration: none;
}
.mcard-new:hover { border-color: rgba(59,130,246,0.42); color: #3b82f6; }
.mcard-new i { font-size: 1.5rem; }
.mcard-new span { font-size: 0.72rem; font-weight: 500; }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 3rem 1.5rem; color: #475569; }
.empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
.empty-state p { font-size: 0.85rem; margin-bottom: 1.5rem; }
.empty-cta { background: #3b82f6; border: none; border-radius: 10px; color: #fff; font-size: 0.85rem; font-weight: 600; padding: 10px 22px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%);
  background: #0d2b19; border: 1px solid #166534; color: #4ade80;
  padding: 0.55rem 1.2rem; border-radius: 10px; font-size: 0.8rem;
  z-index: 300; opacity: 0; transition: opacity 0.25s; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.err { background: #2b0a0a; border-color: #7f1d1d; color: #f87171; }

/* ── Bottom nav ── */
.bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 0 12px calc(env(safe-area-inset-bottom, 12px) + 20px);
      background: transparent;
      pointer-events: none;
    }
    .nav-row {
      display: flex;
      align-items: stretch;
      height: 62px;
      padding: 0 6px;
      background: rgba(10, 15, 28, 0.95);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(59,130,246,0.18);
      border-radius: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 0.5px rgba(255,255,255,0.05) inset;
      pointer-events: all;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 0 4px;
      text-decoration: none;
      border-radius: 16px;
      margin: 6px 3px;
      transition: background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item i { font-size: 1.45rem; color: #5a6a7a; line-height: 1; display: block; transition: color 0.15s; }
    .nav-item span { font-size: 0.62rem; color: #5a6a7a; letter-spacing: 0.3px; white-space: nowrap; font-weight: 500; transition: color 0.15s; }
    .nav-item.active { background: rgba(59,130,246,0.15); }
    .nav-item.active i { color: #60a5fa; }
    .nav-item.active span { color: #60a5fa; font-weight: 700; }
.nav-item i { font-size: 1.2rem; }

/* Loading skeleton */
.skeleton { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
.skel-card { background: rgba(13,22,38,0.5); border: 1px solid #1e2d45; border-radius: 14px; height: 148px; }

.sk-card { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 1.1rem 1rem; margin-bottom: 0.75rem; }
.sk-line { background: linear-gradient(90deg,rgba(255,255,255,0.06) 25%,rgba(255,255,255,0.12) 50%,rgba(255,255,255,0.06) 75%); background-size: 200% 100%; animation: sk 1.4s infinite; border-radius: 6px; }
@keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <span class="page-title">Medleys</span>
    <button class="header-create" type="button" onclick="crearMedley()" aria-label="Crear medley"><i class="ti ti-plus"></i></button>
  </div>
  <div class="page-sub" id="page-sub">Tus combinaciones, listas para tocar</div>
</header>

<section class="scope-wrap" aria-label="Origen de los medleys">
  <div class="scope-label">Espacio</div>
  <div class="scope-tabs" id="scope-tabs">
    <button class="scope-btn active" type="button" data-scope="personal" onclick="setScope(this)"><i class="ti ti-user"></i> Míos</button>
  </div>
</section>

<div class="search-wrap">
  <div class="search-inner">
    <i class="ti ti-search"></i>
    <input class="search-input" id="search-input" placeholder="Buscar medley..." oninput="filtrar()">
  </div>
</div>

<div class="filter-tabs" id="filter-tabs">
  <button class="ftab active" data-filter="all" onclick="setFilter(this)">Todos</button>
</div>

<div class="grid" id="grid">
  <!-- Skeleton mientras carga -->
  <div class="skel-card skeleton"></div>
  <div class="skel-card skeleton"></div>
  <div class="skel-card skeleton"></div>
  <div class="skel-card skeleton"></div>
</div>

<!-- Context menu (aparece con "...") -->
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-item" onclick="ctxEditar()"><i class="ti ti-edit"></i> Editar</div>
  <div class="ctx-item danger" onclick="ctxEliminar()"><i class="ti ti-trash"></i> Eliminar</div>
</div>

<div class="toast" id="toast"></div>

<nav class="bottom-nav">
  <div class="nav-row">
    <a class="nav-item" href="/library.html"><i class="ti ti-books"></i><span>Biblioteca</span></a>
    <a class="nav-item" href="/setlist.html"><i class="ti ti-list-check"></i><span>Setlist</span></a>
    <a class="nav-item active" href="/medleys.html"><i class="ti ti-layers-intersect"></i><span>Medley</span></a>
    <a class="nav-item" href="/more.html"><i class="ti ti-dots-circle-horizontal"></i><span>Más</span></a>
  </div>
</nav>

<script>
const _sb = supabase.createClient(
  'https://kzqnsbztfyhyyageuboz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6cW5zYnp0ZnloeXlhZ2V1Ym96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTgzOTQsImV4cCI6MjA5MTQ5NDM5NH0.n0scEJcx6tZ7IihDKxdr3R2LDipZhv2oDbxwLiLq53w'
)

// ── State ──
let allMedleys = []
let allSongs = []
let filteredMedleys = []
let activeFilter = 'all'
let searchQ = ''
let ctxMedleyId = null
let session = null
let groups = []
let activeScope = 'personal'

const GRADIENTS = [
  ['#1e3a5f','#0f2240'],
  ['#0f3528','#082a1a'],
  ['#3a1508','#2a0e04'],
  ['#2d1a4a','#1a0d38'],
  ['#1a3030','#0d2020'],
  ['#3a2000','#2a1800'],
]

function gradientForId(id) {
  const s = String(id || '000000')
  const n = parseInt(s.slice(-6), 16) || 0
  return GRADIENTS[n % GRADIENTS.length]
}


async function init() {
      try {
        const { data: { session: s } } = await _sb.auth.getSession()
        if (!s) { window.location.href = '/login.html'; return }
        session = s

        // Fetch songs and medleys in parallel (saves ~300ms)
        const [songsRes, medleysRes, membershipsRes] = await Promise.all([
          _sb.from('Songs').select('id,title').order('title'),
          _sb.from('medleys').select('*, medley_sections(id, song_id, order)').order('created_at', { ascending: false }),
          _sb.from('group_members').select('groups(id, name, leader_id)').eq('user_id', s.user.id)
        ])
        allSongs = songsRes.data || []
        groups = (membershipsRes.data || []).map(row => row.groups).filter(Boolean)
        if (medleysRes.error) {
          const errMsg = medleysRes.error.message || medleysRes.error.code || JSON.stringify(medleysRes.error)
          document.getElementById('page-sub').textContent = 'Error: ' + errMsg
          showToast('Error al cargar medleys', true)
          renderGrid([]); return
        }
        allMedleys = (medleysRes.data || []).map(m => ({
          ...m,
          song_ids: [...new Set((m.medley_sections || []).map(ms => ms.song_id).filter(Boolean))]
        }))
        buildScopeTabs()
        buildFilterTabs()
        aplicarFiltro()
        actualizarSubtitulo()
      } catch (err) {
        console.error('[init]', err)
        document.getElementById('page-sub').textContent = 'Error: ' + (err.message || String(err))
        renderGrid([])
      }
    }async function cargarMedleys() {
  const { data, error } = await _sb.from('medleys').select('*, medley_sections(id, song_id, order)').order('created_at', { ascending: false })
  if (error) {
    console.error('[cargarMedleys] error:', JSON.stringify(error))
    document.getElementById('page-sub').textContent = 'Error: ' + (error.message || error.code || JSON.stringify(error))
    showToast('Error al cargar medleys', true)
    renderGrid([])
    return
  }
  console.log('[cargarMedleys] rows:', data && data.length)
  allMedleys = (data || []).map(m => ({
    ...m,
    song_ids: [...new Set((m.medley_sections || []).map(ms => ms.song_id).filter(Boolean))]
  }))
  buildFilterTabs()
  aplicarFiltro()
  actualizarSubtitulo()
}

function buildFilterTabs() {
  const tagsSet = new Set()
  allMedleys.forEach(m => {
    if (Array.isArray(m.tags)) m.tags.forEach(t => tagsSet.add(t))
  })
  const tabs = document.getElementById('filter-tabs')
  let html = '<button class="ftab active" data-filter="all" onclick="setFilter(this)">Todos</button>'
  tagsSet.forEach(tag => {
    html += `<button class="ftab" data-filter="${tag}" onclick="setFilter(this)">${tag}</button>`
  })
  tabs.innerHTML = html
}

function buildScopeTabs() {
  const tabs = document.getElementById('scope-tabs')
  const personal = '<button class="scope-btn active" type="button" data-scope="personal" onclick="setScope(this)"><i class="ti ti-user"></i> Míos</button>'
  const groupButtons = groups.map(group =>
    `<button class="scope-btn" type="button" data-scope="${escHtml(group.id)}" onclick="setScope(this)"><i class="ti ti-users"></i> ${escHtml(group.name)}</button>`
  ).join('')
  tabs.innerHTML = personal + groupButtons
}

function setScope(btn) {
  document.querySelectorAll('.scope-btn').forEach(item => item.classList.remove('active'))
  btn.classList.add('active')
  activeScope = btn.dataset.scope
  aplicarFiltro()
  actualizarSubtitulo()
}

function setFilter(btn) {
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  activeFilter = btn.dataset.filter
  aplicarFiltro()
}

function filtrar() {
  searchQ = (document.getElementById('search-input').value || '').toLowerCase()
  aplicarFiltro()
}

function aplicarFiltro() {
  filteredMedleys = allMedleys.filter(m => {
    const matchQ = !searchQ || m.name.toLowerCase().includes(searchQ)
    const matchFilter = activeFilter === 'all' || (Array.isArray(m.tags) && m.tags.includes(activeFilter))
    const matchScope = activeScope === 'personal'
      ? !m.group_id && m.user_id === session.user.id
      : String(m.group_id) === activeScope
    return matchQ && matchFilter && matchScope
  })
  renderGrid(filteredMedleys)
}

function actualizarSubtitulo() {
  const n = filteredMedleys.length
  const group = groups.find(item => String(item.id) === activeScope)
  const label = group ? group.name : 'Tus medleys personales'
  document.getElementById('page-sub').textContent = `${label} · ${n === 1 ? '1 guardado' : `${n} guardados`}`
}

function builderUrl() {
  const group = groups.find(item => String(item.id) === activeScope)
  return group && group.leader_id === session.user.id
    ? `/medley-builder.html?group=${encodeURIComponent(group.id)}`
    : '/medley-builder.html'
}

function crearMedley() {
  window.location.assign(builderUrl())
}

function renderGrid(medleys) {
  const grid = document.getElementById('grid')
  if (medleys.length === 0 && searchQ === '' && activeFilter === 'all') {
    grid.innerHTML = `
      <div style="grid-column:1/-1">
        <div class="empty-state">
          <i class="ti ti-layers-intersect"></i>
          <p>No tienes medleys todavía.<br>Crea uno para combinar secciones.</p>
          <a class="empty-cta" href="${builderUrl()}"><i class="ti ti-plus"></i> Crear medley</a>
        </div>
      </div>`
    return
  }
  let html = medleys.map((m, i) => cardHTML(m, i)).join('')
  html += `<a class="mcard-new" href="${builderUrl()}">
    <i class="ti ti-plus"></i>
    <span>Nuevo medley</span>
  </a>`
  grid.innerHTML = html
}

function cardHTML(m, idx) {
  const [g1, g2] = gradientForId(m.id)
  const songs = m.song_ids.map(id => allSongs.find(s => s.id === id)).filter(Boolean)
  const preview = songs.slice(0, 2)
  const extra = songs.length - 2
  const n = songs.length
  const seccLabel = n === 1 ? '1 secc.' : `${n} secc.`
  const thumbStyle = `style="background:linear-gradient(135deg,${g1},${g2})"`
  const trackBars = n > 0 ? `<div class="thumb-tracks">${Array.from({length:n},()=>'<div class="thumb-track"></div>').join('')}</div>` : ''
  const songRows = preview.map(s =>
    `<div class="mcard-song"><i class="ti ti-music"></i> <span>${escHtml(s.title)}</span></div>`
  ).join('')
  const moreChip = extra > 0 ? `<span class="more-chip">+${extra} más</span>` : ''
  return `
  <div class="mcard" id="card-${escHtml(m.id)}" data-name="${escHtml(m.name)}" data-href="/medley-view.html?id=${encodeURIComponent(m.id)}" role="link" tabindex="0" aria-label="Abrir ${escHtml(m.name)}">
    <div class="mcard-thumb" ${thumbStyle}>
      <span class="thumb-title">${escHtml(m.name)}</span>
      ${trackBars}
    </div>
    <div class="mcard-body">
      <div class="mcard-title">${escHtml(m.name)}</div>
      ${songRows}
      ${moreChip}
      <div class="mcard-footer">
        <span class="mcard-count">${seccLabel}</span>
      </div>
    </div>
    <button class="mcard-menu-btn" type="button" data-medley-menu="${escHtml(m.id)}" aria-label="Opciones de ${escHtml(m.name)}">•••</button>
  </div>`
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

function abrirCtx(button, id) {
  ctxMedleyId = id
  const menu = document.getElementById('ctx-menu')
  menu.classList.add('open')
  const rect = button.getBoundingClientRect()
  const menuW = 150, menuH = 120
  let top = rect.bottom + 4
  let left = rect.right - menuW
  if (top + menuH > window.innerHeight) top = rect.top - menuH - 4
  if (left < 8) left = 8
  menu.style.top = top + 'px'
  menu.style.left = left + 'px'
}

document.getElementById('grid').addEventListener('click', event => {
  const menuButton = event.target.closest('.mcard-menu-btn')
  if (menuButton) {
    event.preventDefault()
    event.stopPropagation()
    abrirCtx(menuButton, menuButton.dataset.medleyMenu)
    return
  }

  const card = event.target.closest('.mcard')
  if (!card) return
  window.location.assign(card.dataset.href)
})

document.getElementById('grid').addEventListener('keydown', event => {
  if (event.key !== 'Enter' && event.key !== ' ') return
  const card = event.target.closest('.mcard')
  if (!card || event.target.closest('.mcard-menu-btn')) return
  event.preventDefault()
  window.location.assign(card.dataset.href)
})

function cerrarCtx() {
  document.getElementById('ctx-menu').classList.remove('open')
  ctxMedleyId = null
}

function ctxEditar() {
  const id = ctxMedleyId
  cerrarCtx()
  if (id) window.location.href = `/medley-builder.html?id=${encodeURIComponent(id)}`
}


async function ctxEliminar() {
  const id = ctxMedleyId
  cerrarCtx()
  if (!id) return
  const m = allMedleys.find(x => x.id === id)
  if (!confirm(`¿Eliminar "${m?.name || 'este medley'}"?`)) return

  // Optimistic update: quitar de la UI de inmediato
  const snapshot = allMedleys
  allMedleys = allMedleys.filter(x => x.id !== id)
  aplicarFiltro()
  actualizarSubtitulo()

  const { error } = await _sb.from('medleys').delete().eq('id', id)
  if (error) {
    // Revertir si falló
    allMedleys = snapshot
    aplicarFiltro()
    actualizarSubtitulo()
    showToast('Error al eliminar', true)
    return
  }
  showToast('✓ Medley eliminado')
}

document.addEventListener('click', e => {
  if (!e.target.closest('#ctx-menu') && !e.target.closest('.mcard-menu-btn')) cerrarCtx()
})


let toastTimer = null
function showToast(msg, err = false) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = 'toast' + (err ? ' err' : '') + ' show'
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600)
}
;(function(){
  var c = document.getElementById('grid')
  if (!c) return
  var h = ''
  for (var i = 0; i < 3; i++) h += '<div class="sk-card"><div class="sk-line" style="height:18px;width:'+(55+i*10)+'%;margin-bottom:8px"></div><div class="sk-line" style="height:14px;width:'+(30+i*5)+'%"></div></div>'
  c.innerHTML = h
})()

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && session) {
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'INVALIDATE_CACHE', pattern: '/medleys' })
    }
    setTimeout(() => {
      _sb.from('medleys').select('*, medley_sections(id, song_id, order)').order('created_at', { ascending: false })
        .then(({ data, error }) => {
          if (!error && data) {
            allMedleys = data.map(m => ({...m, song_ids: [...new Set((m.medley_sections || []).map(ms => ms.song_id).filter(Boolean))]}))
            aplicarFiltro()
            actualizarSubtitulo()
          }
        })
    }, 150)
  }
})

if (navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data && event.data.type === 'DATA_UPDATED' && event.data.table === 'medleys' && session) {
      _sb.from('medleys').select('*, medley_sections(id, song_id, order)').order('created_at', { ascending: false })
        .then(({ data, error }) => {
          if (!error && data) {
            allMedleys = data.map(m => ({...m, song_ids: [...new Set((m.medley_sections || []).map(ms => ms.song_id).filter(Boolean))]}))
            aplicarFiltro()
            actualizarSubtitulo()
          }
        })
    }
  })
}

init()
</script>
