<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CQM">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<title>Mis Medleys — CQM</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(135deg, #060b18 0%, #0b1628 35%, #0d0c20 65%, #13082a 100%) fixed;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding-bottom: calc(58px + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(59,130,246,0.10) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 80%, rgba(168,85,247,0.08) 0%, transparent 55%);
  pointer-events: none; z-index: 0;
}
body > * { position: relative; z-index: 1; }

/* ── Header ── */
header {
  background: rgba(8,15,28,0.82);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(59,130,246,0.14);
  padding: 0.85rem 1rem 0.6rem;
  position: sticky; top: 0; z-index: 20;
}
.hdr-row { display: flex; align-items: center; gap: 0.5rem; }
.back-btn { background: none; border: none; color: #3b82f6; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; padding: 2px; }
.page-title { font-size: 1rem; font-weight: 700; color: #e2e8f0; flex: 1; }
.page-sub { font-size: 0.68rem; color: #475569; padding-left: 1.7rem; margin-top: 0.08rem; }

/* ── Search ── */
.search-wrap { padding: 0.6rem 1rem 0.3rem; }
.search-inner { position: relative; }
.search-inner i { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: #475569; font-size: 0.95rem; pointer-events: none; }
.search-input {
  width: 100%; background: rgba(13,22,38,0.70); border: 1px solid #1e2d45;
  border-radius: 10px; padding: 0.5rem 0.85rem 0.5rem 2.1rem;
  color: #e2e8f0; font-size: 0.82rem; font-family: inherit; outline: none;
}
.search-input::placeholder { color: #475569; }
.search-input:focus { border-color: rgba(59,130,246,0.4); }

/* ── Filter tabs ── */
.filter-tabs { display: flex; gap: 0.45rem; padding: 0.3rem 1rem 0.6rem; overflow-x: auto; scrollbar-width: none; }
.filter-tabs::-webkit-scrollbar { display: none; }
.ftab {
  background: none; border: 1px solid #1e2d45; border-radius: 20px;
  color: #64748b; padding: 4px 14px; font-size: 0.72rem; font-weight: 500;
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.ftab.active { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 600; }

/* ── Grid ── */
.grid {
  padding: 0 0.75rem 1rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.65rem;
}

/* ── Medley card ── */
.mcard {
  background: rgba(10,18,35,0.72);
  border: 1.5px solid rgba(30,45,70,0.8);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  transition: border-color 0.18s, box-shadow 0.18s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.mcard:hover {
  border-color: rgba(59,130,246,0.42);
  box-shadow: 0 0 0 1px rgba(59,130,246,0.16), 0 4px 18px rgba(59,130,246,0.10);
}
.mcard:active {
  border-color: #3b82f6;
  box-shadow: 0 0 0 2px rgba(59,130,246,0.32), 0 6px 22px rgba(59,130,246,0.18);
  transform: scale(0.965);
}

/* Thumbnail */
.mcard-thumb {
  height: 70px;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem;
  flex-shrink: 0;
  cursor: pointer;
}
.mcard-thumb img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
}
/* Overlay cámara — solo visible en hover del thumb */
.thumb-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.52);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; opacity: 0; transition: opacity 0.18s;
}
.mcard-thumb:hover .thumb-overlay { opacity: 1; }
.thumb-overlay i { font-size: 1.1rem; color: #fff; }
.thumb-overlay span { font-size: 0.52rem; color: rgba(255,255,255,0.85); letter-spacing: 0.3px; }

/* Thumb initials (fallback) */
.thumb-initials {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; font-weight: 700; color: rgba(255,255,255,0.7);
  letter-spacing: 1px;
}

/* Input file oculto */
.cover-input { display: none; }

/* Card body */
.mcard-body { padding: 0.55rem 0.65rem 0.6rem; flex: 1; display: flex; flex-direction: column; gap: 0.16rem; }
.mcard-title { font-size: 0.8rem; font-weight: 700; color: #e2e8f0; line-height: 1.2; margin-bottom: 0.2rem; }
.mcard-song { display: flex; align-items: center; gap: 0.28rem; font-size: 0.67rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard-song i { font-size: 0.68rem; color: #475569; flex-shrink: 0; }
.more-chip {
  display: inline-block; background: rgba(59,130,246,0.13); color: #60a5fa;
  border-radius: 4px; padding: 1px 6px; font-size: 0.6rem; font-weight: 600;
  margin-top: 0.18rem; align-self: flex-start;
}
.mcard-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.38rem; }
.mcard-count { font-size: 0.68rem; font-weight: 600; color: #3b82f6; }
.mcard-menu-btn {
  background: none; border: none; color: #475569; font-size: 0.9rem;
  cursor: pointer; padding: 2px 4px; line-height: 1;
}
.mcard-menu-btn:hover { color: #94a3b8; }

/* ── Context menu ── */
.ctx-menu {
  position: fixed; z-index: 200;
  background: #0d1a2e;
  border: 1px solid #1e2d45;
  border-radius: 10px;
  padding: 0.3rem 0;
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  min-width: 140px;
  display: none;
}
.ctx-menu.open { display: block; }
.ctx-item {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.55rem 0.9rem; font-size: 0.8rem; color: #94a3b8;
  cursor: pointer; transition: background 0.12s;
}
.ctx-item:hover { background: #1e2d45; color: #e2e8f0; }
.ctx-item.danger { color: #f87171; }
.ctx-item.danger:hover { background: #1a0808; }
.ctx-item i { font-size: 0.95rem; }

/* ── New card ── */
.mcard-new {
  background: rgba(10,18,35,0.40);
  border: 1.5px dashed #1e2d45;
  border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0.42rem; min-height: 140px; cursor: pointer;
  color: #475569; transition: border-color 0.15s, color 0.15s;
  text-decoration: none;
}
.mcard-new:hover { border-color: rgba(59,130,246,0.42); color: #3b82f6; }
.mcard-new i { font-size: 1.5rem; }
.mcard-new span { font-size: 0.72rem; font-weight: 500; }

/* ── Empty state ── */
.empty-state { text-align: center; padding: 3rem 1.5rem; color: #475569; }
.empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
.empty-state p { font-size: 0.85rem; margin-bottom: 1.5rem; }
.empty-cta { background: #3b82f6; border: none; border-radius: 10px; color: #fff; font-size: 0.85rem; font-weight: 600; padding: 10px 22px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%);
  background: #0d2b19; border: 1px solid #166534; color: #4ade80;
  padding: 0.55rem 1.2rem; border-radius: 10px; font-size: 0.8rem;
  z-index: 300; opacity: 0; transition: opacity 0.25s; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.err { background: #2b0a0a; border-color: #7f1d1d; color: #f87171; }

/* ── Bottom nav ── */
.bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 1000;
      background: rgba(8, 12, 22, 0.97);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid rgba(59,130,246,0.20);
      box-shadow: 0 -4px 30px rgba(0,0,0,0.5);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-row {
      display: flex;
      align-items: stretch;
      height: 58px;
      padding: 0 4px;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 0 4px;
      text-decoration: none;
      border-radius: 12px;
      margin: 6px 2px;
      transition: background 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item i { font-size: 1.45rem; color: #5a6a7a; line-height: 1; display: block; transition: color 0.15s; }
    .nav-item span { font-size: 0.62rem; color: #5a6a7a; letter-spacing: 0.3px; white-space: nowrap; font-weight: 500; transition: color 0.15s; }
    .nav-item.active { background: rgba(59,130,246,0.15); }
    .nav-item.active i { color: #60a5fa; }
    .nav-item.active span { color: #60a5fa; font-weight: 700; }
.nav-item i { font-size: 1.2rem; }

/* Loading skeleton */
.skeleton { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
.skel-card { background: rgba(13,22,38,0.5); border: 1px solid #1e2d45; border-radius: 14px; height: 148px; }
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <button class="back-btn" onclick="history.back()"><i class="ti ti-arrow-left"></i></button>
    <span class="page-title">Mis Medleys</span>
  </div>
  <div class="page-sub" id="page-sub">Cargando...</div>
</header>

<div class="search-wrap">
  <div class="search-inner">
    <i class="ti ti-search"></i>
    <input class="search-input" id="search-input" placeholder="Buscar medley..." oninput="filtrar()">
  </div>
</div>

<div class="filter-tabs" id="filter-tabs">
  <button class="ftab active" data-filter="all" onclick="setFilter(this)">Todos</button>
</div>

<div class="grid" id="grid">
  <!-- Skeleton mientras carga -->
  <div class="skel-card skeleton"></div>
  <div class="skel-card skeleton"></div>
  <div class="skel-card skeleton"></div>
  <div class="skel-card skeleton"></div>
</div>

<!-- Context menu (aparece con "...") -->
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-item" onclick="ctxEditar()"><i class="ti ti-edit"></i> Editar</div>
  <div class="ctx-item" onclick="ctxCambiarFoto()"><i class="ti ti-camera"></i> Cambiar foto</div>
  <div class="ctx-item danger" onclick="ctxEliminar()"><i class="ti ti-trash"></i> Eliminar</div>
</div>

<!-- Input file oculto para subir foto -->
<input type="file" id="cover-file-input" class="cover-input" accept="image/*" onchange="onCoverSelected(event)">

<div class="toast" id="toast"></div>

<nav class="bottom-nav">
  <div class="nav-row">
    <a class="nav-item" href="/library.html"><i class="ti ti-home"></i><span>Inicio</span></a>
    <a class="nav-item" href="/setlist.html"><i class="ti ti-list-check"></i><span>Setlist</span></a>
    <a class="nav-item active" href="/medleys.html"><i class="ti ti-layers-intersect"></i><span>Medleys</span></a>
    <a class="nav-item" href="/more.html"><i class="ti ti-dots-circle-horizontal"></i><span>Más</span></a>
  </div>
</nav>

<script>
const _sb = supabase.createClient(
  'https://kzqnsbztfyhyyageuboz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6cW5zYnp0ZnloeXlhZ2V1Ym96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTgzOTQsImV4cCI6MjA5MTQ5NDM5NH0.n0scEJcx6tZ7IihDKxdr3R2LDipZhv2oDbxwLiLq53w'
)

// ── State ──
let allMedleys = []
let allSongs = []
let filteredMedleys = []
let activeFilter = 'all'
let searchQ = ''
let ctxMedleyId = null
let coverTargetId = null
let session = null

const GRADIENTS = [
  ['#1e3a5f','#0f2240'],
  ['#0f3528','#082a1a'],
  ['#3a1508','#2a0e04'],
  ['#2d1a4a','#1a0d38'],
  ['#1a3030','#0d2020'],
  ['#3a2000','#2a1800'],
]

function gradientForId(id) {
  const s = String(id || '000000')
  const n = parseInt(s.slice(-6), 16) || 0
  return GRADIENTS[n % GRADIENTS.length]
}

function initials(name) {
  return (name || '??').split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase()
}

async function init() {
  try {
    const { data: { session: s } } = await _sb.auth.getSession()
    if (!s) { window.location.href = '/login.html'; return }
    session = s

    // Cargar canciones (para preview de nombres)
    const { data: songs } = await _sb.from('Songs').select('id,title').order('title')
    allSongs = songs || []

    await cargarMedleys()
  } catch (err) {
    console.error('[init]', err)
    document.getElementById('page-sub').textContent = 'Error JS: ' + ((err && err.message) || String(err))
    renderGrid([])
  }
}
async function cargarMedleys() {
  const { data, error } = await _sb.from('medleys').select('*').order('created_at', { ascending: false })
  if (error) {
    console.error('[cargarMedleys] error:', JSON.stringify(error))
    document.getElementById('page-sub').textContent = 'Error: ' + (error.message || error.code || JSON.stringify(error))
    showToast('Error al cargar medleys', true)
    renderGrid([])
    return
  }
  console.log('[cargarMedleys] rows:', data && data.length)
  allMedleys = (data || []).map(m => ({
    ...m,
    song_ids: Array.isArray(m.song_ids) ? m.song_ids : []
  }))
  buildFilterTabs()
  aplicarFiltro()
  actualizarSubtitulo()
}

function buildFilterTabs() {
  const tagsSet = new Set()
  allMedleys.forEach(m => {
    if (Array.isArray(m.tags)) m.tags.forEach(t => tagsSet.add(t))
  })
  const tabs = document.getElementById('filter-tabs')
  let html = '<button class="ftab active" data-filter="all" onclick="setFilter(this)">Todos</button>'
  tagsSet.forEach(tag => {
    html += `<button class="ftab" data-filter="${tag}" onclick="setFilter(this)">${tag}</button>`
  })
  tabs.innerHTML = html
}

function setFilter(btn) {
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  activeFilter = btn.dataset.filter
  aplicarFiltro()
}

function filtrar() {
  searchQ = (document.getElementById('search-input').value || '').toLowerCase()
  aplicarFiltro()
}

function aplicarFiltro() {
  filteredMedleys = allMedleys.filter(m => {
    const matchQ = !searchQ || m.name.toLowerCase().includes(searchQ)
    const matchFilter = activeFilter === 'all' || (Array.isArray(m.tags) && m.tags.includes(activeFilter))
    return matchQ && matchFilter
  })
  renderGrid(filteredMedleys)
}

function actualizarSubtitulo() {
  const n = allMedleys.length
  document.getElementById('page-sub').textContent = n === 1 ? '1 guardado' : `${n} guardados`
}

function renderGrid(medleys) {
  const grid = document.getElementById('grid')
  if (medleys.length === 0 && searchQ === '' && activeFilter === 'all') {
    grid.innerHTML = `
      <div style="grid-column:1/-1">
        <div class="empty-state">
          <i class="ti ti-layers-intersect"></i>
          <p>No tienes medleys todavía.<br>Crea uno para combinar secciones.</p>
          <a class="empty-cta" href="/medley-builder.html"><i class="ti ti-plus"></i> Crear medley</a>
        </div>
      </div>`
    return
  }
  let html = medleys.map((m, i) => cardHTML(m, i)).join('')
  html += `<a class="mcard-new" href="/medley-builder.html">
    <i class="ti ti-plus"></i>
    <span>Nuevo medley</span>
  </a>`
  grid.innerHTML = html
}

function cardHTML(m, idx) {
  const [g1, g2] = gradientForId(m.id)
  const songs = m.song_ids.map(id => allSongs.find(s => s.id === id)).filter(Boolean)
  const preview = songs.slice(0, 2)
  const extra = songs.length - 2
  const n = songs.length
  const seccLabel = n === 1 ? '1 secc.' : `${n} secc.`
  const thumbStyle = m.cover_url
    ? `style="background:${g1}"`
    : `style="background:linear-gradient(135deg,${g1},${g2})"`
  const imgTag = m.cover_url
    ? `<img src="${escHtml(m.cover_url)}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : ''
  const initialsHtml = m.cover_url ? '' : `<div class="thumb-initials">${escHtml(initials(m.name))}</div>`
  const songRows = preview.map(s =>
    `<div class="mcard-song"><i class="ti ti-music"></i> <span>${escHtml(s.title)}</span></div>`
  ).join('')
  const moreChip = extra > 0 ? `<span class="more-chip">+${extra} más</span>` : ''
  return `
  <div class="mcard" id="card-${escHtml(m.id)}" onclick="abrirMedley('${escHtml(m.id)}')" data-name="${escHtml(m.name)}">
    <div class="mcard-thumb" ${thumbStyle} onclick="event.stopPropagation(); abrirCambiarFoto('${escHtml(m.id)}')">
      ${imgTag}
      ${initialsHtml}
      <div class="thumb-overlay">
        <i class="ti ti-camera"></i>
        <span>Cambiar foto</span>
      </div>
    </div>
    <div class="mcard-body">
      <div class="mcard-title">${escHtml(m.name)}</div>
      ${songRows}
      ${moreChip}
      <div class="mcard-footer">
        <span class="mcard-count">${seccLabel}</span>
        <button class="mcard-menu-btn" onclick="event.stopPropagation(); abrirCtx(event, '${escHtml(m.id)}')">•••</button>
      </div>
    </div>
  </div>`
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

function abrirMedley(id) {
  const card = document.getElementById(`card-${id}`)
  if (card) {
    card.style.borderColor = '#3b82f6'
    card.style.boxShadow = '0 0 0 2px rgba(59,130,246,0.35)'
    card.style.transform = 'scale(0.965)'
  }
  setTimeout(() => {
    window.location.href = `/medley-view.html?id=${encodeURIComponent(id)}`
  }, 140)
}

function abrirCtx(e, id) {
  ctxMedleyId = id
  const menu = document.getElementById('ctx-menu')
  menu.classList.add('open')
  const rect = e.currentTarget.getBoundingClientRect()
  const menuW = 150, menuH = 120
  let top = rect.bottom + 4
  let left = rect.right - menuW
  if (top + menuH > window.innerHeight) top = rect.top - menuH - 4
  if (left < 8) left = 8
  menu.style.top = top + 'px'
  menu.style.left = left + 'px'
}

function cerrarCtx() {
  document.getElementById('ctx-menu').classList.remove('open')
  ctxMedleyId = null
}

function ctxEditar() {
  cerrarCtx()
  if (ctxMedleyId) window.location.href = `/medley-builder.html?id=${encodeURIComponent(ctxMedleyId)}`
}

function ctxCambiarFoto() {
  const id = ctxMedleyId
  cerrarCtx()
  abrirCambiarFoto(id)
}

async function ctxEliminar() {
  const id = ctxMedleyId
  cerrarCtx()
  if (!id) return
  const m = allMedleys.find(x => x.id === id)
  if (!confirm(`¿Eliminar "${m?.name || 'este medley'}"?`)) return
  const { error } = await _sb.from('medleys').delete().eq('id', id)
  if (error) { showToast('Error al eliminar', true); return }
  allMedleys = allMedleys.filter(x => x.id !== id)
  aplicarFiltro()
  actualizarSubtitulo()
  showToast('✓ Medley eliminado')
}

document.addEventListener('click', e => {
  if (!e.target.closest('#ctx-menu') && !e.target.closest('.mcard-menu-btn')) cerrarCtx()
})

function abrirCambiarFoto(id) {
  coverTargetId = id
  document.getElementById('cover-file-input').click()
}

async function onCoverSelected(e) {
  const file = e.target.files[0]
  if (!file || !coverTargetId) return
  e.target.value = ''
  if (file.size > 3 * 1024 * 1024) { showToast('Imagen muy grande (máx 3 MB)', true); return }
  showToast('Subiendo foto...')
  const ext = file.name.split('.').pop() || 'jpg'
  const path = `covers/${coverTargetId}.${ext}`
  const { error: upErr } = await _sb.storage
    .from('medley-covers')
    .upload(path, file, { upsert: true, contentType: file.type })
  if (upErr) {
    showToast('No se pudo subir la foto. Verifica el bucket.', true)
    return
  }
  const { data: { publicUrl } } = _sb.storage.from('medley-covers').getPublicUrl(path)
  const { error: updateErr } = await _sb.from('medleys').update({ cover_url: publicUrl }).eq('id', coverTargetId)
  if (updateErr) { showToast('Foto subida pero no guardada', true); return }
  const idx = allMedleys.findIndex(m => m.id === coverTargetId)
  if (idx !== -1) allMedleys[idx].cover_url = publicUrl
  aplicarFiltro()
  showToast('✓ Foto actualizada')
  coverTargetId = null
}

let toastTimer = null
function showToast(msg, err = false) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = 'toast' + (err ? ' err' : '') + ' show'
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600)
}

init()
</script>
